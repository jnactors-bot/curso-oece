<title>Repaso espaciado OECE</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#f4f8ff;--card:#ffffff;--fg:#14213d;--mut:#52617c;--line:#d7e2f5;--hl:#ffe14d;--ok:#16a34a;--bad:#e11d48;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 Inter,system-ui,sans-serif}
.w{max-width:880px;margin:auto;padding:0 18px 80px}
h1,h2,h3{font-family:'Archivo Black',sans-serif;line-height:1.1;text-wrap:balance;margin:0}
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;margin:0 -18px 20px;background:linear-gradient(135deg,#bfdbfe,#ddd6fe);min-height:120px;box-shadow:0 8px 24px rgba(37,99,235,.15)}
.hero img{width:100%;height:300px;object-fit:cover;display:block}
.hero div{position:absolute;inset:auto 0 0 0;padding:34px 24px 22px;background:linear-gradient(transparent,rgba(255,255,255,.96) 62%)}
.chip{display:inline-block;font:700 13px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;background:var(--hl);color:#3a2f00;padding:4px 12px;border-radius:99px;margin-bottom:10px}
h1{font-size:clamp(30px,7vw,52px);color:#10224a}h1 em,h2 em{font-style:normal;color:var(--blue);background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 4px}
h2{font-size:clamp(23px,5vw,32px);margin:42px 0 14px;color:#10224a}
.num{display:inline-block;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:12px;padding:2px 12px;margin-right:6px}
.lead{color:var(--mut);margin:0 0 14px;font-size:19px}.lead b{color:var(--fg)}
.nav{display:flex;gap:12px;justify-content:space-between;margin:0 0 14px;font-size:15px}
.nav a{color:var(--blue);text-decoration:none;font-weight:700}.nav.end{margin-top:40px}
.art{font:700 12px 'IBM Plex Mono',monospace;color:#1e3a8a;background:#dbeafe;border-radius:6px;padding:3px 9px;display:inline-block}
.artline{margin:12px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 2px 10px rgba(20,33,61,.05)}
.card ul{margin:0;padding-left:22px}.card li{margin:7px 0}
.sec{margin-bottom:12px}
.figure img{width:100%;max-height:360px;object-fit:cover;border-radius:22px;display:block;margin:0 0 16px;box-shadow:0 8px 22px rgba(20,33,61,.15)}
.leyenda{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.lg{font:700 12px 'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:4px 12px;border:2px solid}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.row.stats{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.cd{border-radius:18px;padding:15px 18px;border:2px solid;box-shadow:0 2px 8px rgba(20,33,61,.05)}
.cd h4{margin:0 0 4px;font:400 17px 'Archivo Black',sans-serif}
.cd p{margin:0;font-size:17px;color:var(--fg)}
.k-def{background:var(--blue-bg);border-color:#93c5fd;color:var(--blue)}.k-def h4{color:#1d4ed8}
.k-regla{background:var(--green-bg);border-color:#86efac;color:var(--green)}.k-regla h4{color:#15803d}
.k-imp{background:var(--vio-bg);border-color:#c4b5fd;color:var(--vio)}.k-imp h4{color:#6d28d9}
.k-ej{background:var(--yel-bg);border-color:#fde047;color:var(--yel)}.k-ej h4{color:#854d0e}
.k-trap{background:var(--red-bg);border-color:#fda4af;color:var(--red)}.k-trap h4{color:#be123c}
.cd p,.stat small{color:var(--fg)}
.stat{border-radius:18px;padding:14px;text-align:center;border:2px solid;box-shadow:0 2px 8px rgba(20,33,61,.05)}
.stat .n{font:400 34px/1.1 'Archivo Black',sans-serif}
.stat.k-def .n{color:#1d4ed8}.stat.k-regla .n{color:#15803d}.stat.k-imp .n{color:#6d28d9}.stat.k-ej .n{color:#854d0e}.stat.k-trap .n{color:#be123c}
.stat h4{margin:4px 0;font-size:15px;font-family:'Archivo Black',sans-serif;font-weight:400}.stat small{font-size:14px}
.ban{grid-column:1/-1;text-align:center;font:400 clamp(18px,4vw,24px)/1.3 'Archivo Black',sans-serif;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:18px;padding:18px 20px;color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.simple{background:#fffbea;border:2px dashed #f2c94c;border-radius:20px;padding:16px 20px;margin:16px 0}
.simple h3{font-size:20px;color:#7a5b00;margin-bottom:6px}.simple ul{margin:0;padding-left:22px}.simple li{margin:8px 0;font-size:17px}
.glos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.glos div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px}
.glos b{display:block;color:#1d4ed8;font-family:'IBM Plex Mono',monospace}.glos span{color:var(--mut)}
.trap{background:var(--red-bg);border:2px solid #fda4af;border-radius:18px;padding:16px;margin:12px 0}
.q{margin:16px 0}.q p{font-weight:700;font-size:18px}
.q button,button.sel{display:block;width:100%;text-align:left;background:#fff;color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:13px 16px;margin:9px 0;font:inherit;cursor:pointer;box-shadow:0 1px 4px rgba(20,33,61,.05)}
.q button:hover{border-color:#93c5fd;background:#f0f6ff}
.q button.ok{background:#dcfce7;border-color:var(--ok)}.q button.no{background:#ffe4e8;border-color:var(--bad)}.q button.sel{background:#e0e9ff;border-color:var(--blue)}
.q .ex{display:none;background:#f0f6ff;border-radius:12px;padding:10px 14px;color:var(--fg);font-size:16px}
.go{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:0;border-radius:99px;padding:14px 28px;font:700 17px Inter,sans-serif;cursor:pointer;width:auto!important;text-align:center!important;display:inline-block!important;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.clock{position:sticky;top:0;z-index:5;background:#fff;border:2px solid var(--line);border-radius:0 0 14px 14px;padding:8px 14px;font:700 18px 'IBM Plex Mono',monospace;text-align:center;color:#92400e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.idx{display:block;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:var(--fg);box-shadow:0 4px 14px rgba(20,33,61,.08);transition:transform .15s}
.idx:hover{transform:translateY(-3px)}
.idx img{width:100%;height:140px;object-fit:cover;display:block}.idx div{padding:14px}.idx h3{font-size:18px;margin:2px 0 6px;color:#10224a}.idx p{margin:0;color:var(--mut);font-size:14px}
.foot{color:var(--mut);font-size:13px;margin-top:30px}
h2.comp{font-size:20px;margin:30px 0 12px;color:var(--blue);border-left:6px solid var(--vio);padding-left:12px}
.tagcaso{display:inline-block;font:700 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;background:#7c3aed;color:#fff;border-radius:6px;padding:2px 7px;margin-right:4px;vertical-align:1px}

.stepbox{background:#fff;border:2px solid #93c5fd;border-radius:20px;padding:16px 20px;margin:18px 0;box-shadow:0 4px 14px rgba(37,99,235,.12)}
.stepbox h3{font-size:19px;color:#1d4ed8;margin-bottom:6px}.stepbox p{margin:4px 0 12px;color:var(--mut)}
.reabrir{display:none;background:none;border:0;color:var(--blue);font:700 15px Inter,sans-serif;cursor:pointer;margin:6px 0;text-decoration:underline}
.tabwrap{overflow-x:auto}.tabla{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border-radius:14px;overflow:hidden}
.tabla th{background:#dbeafe;color:#10224a;text-align:left;padding:8px 10px}.tabla td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tabla tr.tok td:first-child{color:#15803d;font-weight:700}.tabla tr.tno{background:#fff1f3}.tabla tr.tno td:first-child{color:#be123c;font-weight:700}
.dia{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0}
.dia.hoy{border-color:#2563eb;box-shadow:0 6px 18px rgba(37,99,235,.2);background:#f3f8ff}
.dia h3{font-size:18px;color:#10224a;margin-bottom:8px}.dia .tag{font:700 11px 'IBM Plex Mono',monospace;background:var(--hl);color:#3a2f00;border-radius:99px;padding:2px 10px;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:var(--fg);background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.tile b{display:block;font-size:16px}.tile .estado{font-size:13px;color:var(--mut)}.tile.hecha{background:#e3f7ea;border-color:#86efac}.tile:hover{border-color:#93c5fd}
.barra{height:14px;background:#e3ecfb;border-radius:99px;overflow:hidden}.barra div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#16a34a);transition:width .4s}
.cuenta{font:400 clamp(26px,6vw,40px)/1.1 'Archivo Black',sans-serif;color:#be123c}
.bigcard{display:flex;gap:14px;flex-wrap:wrap}.bigcard>div{flex:1 1 220px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.bigcard .n{font:400 40px 'Archivo Black',sans-serif;color:#2563eb}
.tj{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.tj .c{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px}.tj h3{font-size:16px;color:#1d4ed8;margin-bottom:6px}
.tj ul{margin:0;padding-left:18px}.tj li{margin:5px 0;font-size:15px;cursor:pointer}.tj li.oculto{filter:blur(6px);user-select:none}
input[type=date]{font:inherit;border:2px solid var(--line);border-radius:10px;padding:6px 10px}

</style></head><body><div class="w"><div class="hero"><div style="position:static"><span class="chip">Repaso espaciado</span><h1>Repaso <em>de hoy</em></h1></div></div><nav class="nav"><a href="index.html">← Panel de estudio</a></nav><div id="repinfo"></div><div id="rep"></div></div><script>
var KEY='oece_activo_v1';
function S(){var s={};try{s=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
 s.cfg=s.cfg||{};if(!s.cfg.exam)s.cfg.exam='2026-10-19';s.done=s.done||{};s.seen=s.seen||{};s.cards=s.cards||[];s.notes=s.notes||{};return s}
function W(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pad(n){return n<10?'0'+n:''+n}
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
function fmtDue(ms){var d=new Date(ms),h=new Date(),m=new Date();m.setDate(h.getDate()+1);
 var dia=d.toDateString()===h.toDateString()?'hoy':(d.toDateString()===m.toDateString()?'mañana':DIAS[d.getDay()]+' '+d.getDate());
 return dia+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function dueFor(stage,now,s){
 var ex=new Date(s.cfg.exam+'T08:00:00'),eve=new Date(ex.getTime()-86400000);eve.setHours(18,0,0,0);var t;
 if(stage===1)t=now+3*3600000;
 else if(stage===2){var d=new Date(now);d.setDate(d.getDate()+1);d.setHours(9,0,0,0);t=d.getTime()}
 else t=eve.getTime();
 if(stage>=2&&t>=ex.getTime())return null;
 if(stage===3&&t<=now+3600000)return null;
 return t}
function addCard(s,cap,ids){
 var c=s.cards.filter(function(x){return x.cap===cap&&x.stage<4})[0],now=Date.now();
 if(c){ids.forEach(function(i){if(c.qids.indexOf(i)<0)c.qids.push(i)});c.stage=1;c.due=dueFor(1,now,s)}
 else s.cards.push({cap:cap,qids:ids.slice(),stage:1,due:dueFor(1,now,s),fails:0})}
function advance(s,c){
 var st=c.stage+1,now=Date.now(),d=null;
 while(st<=3){d=dueFor(st,now,s);if(d)break;st++}
 if(st>3||!d){c.stage=4;c.due=null}else{c.stage=st;c.due=d}}
function runQuiz(root,qs,finishLabel,onFinish){
 root.innerHTML='';var answers={};
 var info=document.createElement('p');info.className='lead';root.appendChild(info);
 qs.forEach(function(q,qi){
  var ord=shuffle(q.opts.map(function(_,i){return i}));
  var d=document.createElement('div');d.className='q';
  d.innerHTML='<p>'+(q.caso?'<span class="tagcaso">CASO</span> ':'')+(qi+1)+'. '+q.stem+'</p>';
  ord.forEach(function(oi){var b=document.createElement('button');b.textContent=q.opts[oi];
   b.onclick=function(){answers[qi]=oi;[].forEach.call(d.querySelectorAll('button'),function(x){x.classList.remove('sel')});b.classList.add('sel');upd()};d.appendChild(b)});
  root.appendChild(d)});
 var btn=document.createElement('button');btn.className='go';root.appendChild(btn);
 function upd(){var n=Object.keys(answers).length;
  info.textContent='Respondidas '+n+' de '+qs.length+' · sin pistas: la corrección llega al final';
  btn.disabled=n<qs.length;btn.style.opacity=n<qs.length?.5:1;
  btn.textContent=n<qs.length?'Responde todas para corregir':finishLabel}
 upd();
 btn.onclick=function(){if(Object.keys(answers).length<qs.length)return;
  onFinish(qs.map(function(q,qi){return{q:q,pick:answers[qi],ok:answers[qi]===q.ok}}))}}
function tablaCorreccion(res){
 var ok=res.filter(function(r){return r.ok}).length;
 var h='<h2>Corrección: <em>'+ok+' de '+res.length+'</em></h2>';
 h+='<div class="tabwrap"><table class="tabla"><tr><th>#</th><th>Tu respuesta</th><th>Correcta</th><th>Dónde está</th></tr>';
 res.forEach(function(r,i){h+='<tr class="'+(r.ok?'tok':'tno')+'"><td>'+(i+1)+(r.ok?' ✓':' ✗')+'</td><td>'+r.q.opts[r.pick]+'</td><td>'+r.q.opts[r.q.ok]+'</td><td><span class="art">'+r.q.art+'</span></td></tr>'});
 h+='</table></div>';
 var errs=res.filter(function(r){return !r.ok});
 if(errs.length){h+='<h2>Solo tus <em>errores</em></h2>';
  errs.forEach(function(r){h+='<div class="trap"><b>'+r.q.stem+'</b><br><span style="color:#be123c"><b>Tú:</b> '+r.q.opts[r.pick]+'</span><br><span style="color:#15803d"><b>Correcta:</b> '+r.q.opts[r.q.ok]+'</span><br><small>'+r.q.exp+' <span class="art">'+r.q.art+'</span></small></div>'})}
 else h+='<div class="simple"><h3>🎯 Sin errores</h3><p>Perfecto. De todas formas, el repaso espaciado te volverá a preguntar con preguntas nuevas.</p></div>';
 return h}

exceptúa esos supuestos y la contratación por catálogos electrónicos.", "art": "Ley art. 50.1 y 50.2", "cap": 1, "caso": true}, {"id": "m1q1", "stem": "Una base exige que los equipos ofertados sean de una marca específica, sin justificación técnica. ¿Qué principios vulnera principalmente?", "opts": ["Libertad de concurrencia e igualdad de trato", "Presunción de veracidad y causalidad, porque la entidad no sustentó la elección", "Sostenibilidad e innovación, porque no se consideró el ciclo de vida del equipo", "Legalidad y vigencia tecnológica, porque la marca podría estar desactualizada"], "ok": 0, "exp": "Pedir un requisito que solo cumple una marca restringe el libre acceso de proveedores y trata de forma desigual a los demás.", "art": "Ley art. 5.1 (h) y (k)", "cap": 1, "caso": false}, {"id": "m1q2", "stem": "¿Cuál de estas NO es un principio rector de la contratación pública?", "opts": ["Discrecionalidad plena de la entidad", "Valor por dinero, que busca la mejor combinación de calidad, costo y plazo", "Integridad, que exige honestidad y denunciar lo indebido en el proceso", "Causalidad, según el cual responde quien realiza la conducta sancionable"], "ok": 0, "exp": "Los principios del art. 5 incluyen valor por dinero, integridad y causalidad. La discrecionalidad plena no existe: toda actuación debe respetar la legalidad.", "art": "Ley art. 5.1", "cap": 1, "caso": false}, {"id": "m1q3", "stem": "Una entidad contrata un servicio bancario, que es un supuesto excluido de la Ley. ¿Debe respetar los principios de la contratación pública?", "opts": ["Sí: se excluye de la Ley, pero los principios siguen rigiendo la contratación", "No: lo excluido queda totalmente fuera de la Ley y también de sus principios", "Solo si el monto de la contratación supera el tope de 8 UIT vigentes", "Solo cuando el OECE lo solicite expresamente a la entidad contratante"], "ok": 0, "exp": "Los supuestos excluidos se separan de la Ley con excepción de las disposiciones sobre los principios.", "art": "Ley art. 7.1", "cap": 1, "caso": false}, {"id": "m1q4", "stem": "¿Qué significa el principio de presunción de veracidad?", "opts": ["Los documentos y declaraciones se presumen ciertos, aunque admiten prueba en contrario", "Los documentos presentados son ciertos y ya no pueden ser cuestionados por la entidad", "Los documentos se presumen ciertos solo cuando el monto de la contratación es bajo", "Los documentos se presumen falsos hasta que la entidad los verifique ante la autoridad"], "ok": 0, "exp": "Es una presunción, no una verdad absoluta: se puede probar lo contrario.", "art": "Ley art. 5.1 (e)", "cap": 1, "caso": false}, {"id": "m1q5", "stem": "¿Qué es un contrato menor?", "opts": ["El de monto igual o inferior a 8 UIT, que se contrata sin procedimiento de selección", "El de monto de hasta 5 UIT vigentes, que se contrata sin procedimiento de selección", "El de monto de hasta 50 UIT vigentes, que se contrata mediante comparación de precios", "El de 8 UIT o menos, pero que debe tramitarse con una licitación pública abreviada"], "ok": 0, "exp": "Los contratos menores son de ocho UIT o menos, vigentes al momento de la contratación, y no requieren procedimiento de selección.", "art": "Ley art. 34.1", "cap": 1, "caso": false}, {"id": "m1q6", "stem": "¿Quién supervisa los contratos menores?", "opts": ["El OECE", "Solo el órgano de control de cada entidad", "La Contraloría de manera exclusiva", "Nadie: están fuera de la Ley"], "ok": 0, "exp": "Los contratos menores se rigen por la Ley, se publican en la Pladicop y están sujetos a la supervisión del OECE.", "art": "Ley arts. 3.1 y 34", "cap": 1, "caso": false}, {"id": "m1q7", "stem": "Una entidad compra el combustible del año en pedidos pequeños, cada uno como contrato menor, para evitar licitar. ¿Qué configura?", "opts": ["Fraccionamiento, que está prohibido", "Una práctica válida si cada pedido es de 8 UIT o menos", "Una contratación directa por desabastecimiento", "Un supuesto excluido de la Ley"], "ok": 0, "exp": "Está prohibido fraccionar mediante varios procedimientos o contratos menores para evitar el procedimiento que corresponde según la necesidad anual.", "art": "Ley art. 50.1", "cap": 1, "caso": false}, {"id": "m1q8", "stem": "Las Fuerzas Armadas realizan una contratación declarada secreta por decreto supremo. ¿Cómo se contrata?", "opts": ["Por contratación directa, con opinión previa favorable de la Contraloría", "Como supuesto excluido del art. 7, sin ninguna opinión previa de la Contraloría", "Con contratos menores sucesivos, que no tienen límite de monto en esos casos", "Por una licitación pública reservada, convocada solo a proveedores del sector"], "ok": 0, "exp": "Las contrataciones declaradas de carácter secreto de FF.AA., PNP y SINA son un supuesto de contratación directa.", "art": "Ley art. 55.1 (m)", "cap": 1, "caso": false}]}, "2": {"name": "Quién hace qué en la entidad", "qs": [{"id": "c2a", "stem": "La DEC revisa un requerimiento de un contrato menor y decide mejorarlo modificando su contenido. ¿Qué debe hacer antes de pedir cotizaciones?", "opts": ["Solicitar al área usuaria su no objeción al requerimiento modificado", "Nada: la DEC puede modificar el requerimiento por su cuenta antes de cotizar el mercado", "Pedir primero la aprobación de la AGA para que autorice el cambio del requerimiento", "Solicitar la opinión previa del OECE sobre la modificación del requerimiento"], "ok": 0, "exp": "El área usuaria puede objetar de manera sustentada si la modificación no satisface su necesidad.", "art": "Reglamento art. 227.2", "cap": 2, "caso": true}, {"id": "c2b", "stem": "Para una contratación directa por proveedor único, el titular quiere delegar su aprobación en el gerente de administración. ¿Qué responde la norma?", "opts": ["La AGA aprueba esos supuestos y su facultad es indelegable", "El titular puede delegarla en cualquier funcionario, sin límite alguno, mediante resolución", "La aprueba el área usuaria que formuló el requerimiento de la contratación", "La aprueba el comité de selección designado para el procedimiento"], "ok": 0, "exp": "El titular aprueba solo emergencia, desabastecimiento y continuación de contrato resuelto o nulo.", "art": "Ley art. 55.2; Reglamento arts. 18 y 19", "cap": 2, "caso": true}, {"id": "c2c", "stem": "Un comité de tres integrantes está evaluando. Uno de ellos propone abstenerse en la votación sobre las ofertas. ¿Es válido?", "opts": ["No: los acuerdos son por unanimidad o mayoría y no cabe la abstención", "Sí, siempre que deje sustentada su abstención en el acta de la sesión del comité", "Sí, siempre que no sea el presidente ni el integrante comprador público de la DEC", "Sí, siempre que la DEC autorice la abstención antes de que se inicie la votación"], "ok": 0, "exp": "Si hay voto en discordia se consigna con sustento en el acta; los integrantes son solidariamente responsables.", "art": "Reglamento art. 59.4 y 59.5 (b)", "cap": 2, "caso": true}, {"id": "c2d", "stem": "Se propone como integrante del comité a un servidor al que se delegó aprobar el expediente de contratación del mismo procedimiento. ¿Qué corresponde?", "opts": ["No puede ser designado: queda impedido dentro de ese proceso de contratación", "Puede ser designado, siempre que sea además comprador público de la DEC de la entidad", "Puede ser designado si renuncia a la delegación después de la aprobación del expediente", "Puede ser designado, aunque solo como integrante suplente del comité de selección"], "ok": 0, "exp": "También están impedidos el titular, la AGA y los servidores con atribuciones de control o fiscalización.", "art": "Reglamento art. 61 (d)", "cap": 2, "caso": true}, {"id": "c2e", "stem": "Se designa como experto de un jurado a un profesional con 7 años de experiencia general y 5 años en la especialidad del objeto. ¿Cumple?", "opts": ["No: el jurado exige no menos de ocho años de experiencia general y cinco en la especialidad", "Sí: con cinco años de experiencia en la especialidad el experto ya cumple el requisito", "Sí: el jurado exige siete años de experiencia general y cinco en la especialidad", "No: el jurado exige diez años de experiencia general y seis en la especialidad"], "ok": 0, "exp": "Los perfiles se determinan en la estrategia de contratación; los expertos pueden ser de la entidad, de otra o un proveedor contratado.", "art": "Reglamento art. 57.1 a 57.3", "cap": 2, "caso": true}, {"id": "c2f", "stem": "Se propone un comité de tres integrantes, todos del área usuaria y ninguno comprador público de la DEC. ¿Es válido?", "opts": ["No: el comité exige al menos un comprador público de la DEC y un experto o profesional técnico", "Sí: el comité puede conformarse con cualquier servidor de la entidad, sin otro requisito", "Sí: basta con que el titular de la entidad apruebe la conformación del comité", "No: el comité debe estar conformado por cinco integrantes y no por tres"], "ok": 0, "exp": "El jurado, en cambio, está conformado por tres o cinco expertos.", "art": "Reglamento art. 56.1 (b)", "cap": 2, "caso": true}, {"id": "m2q1", "stem": "¿Quién aprueba el expediente de contratación?", "opts": ["La autoridad de la gestión administrativa", "La DEC, que lo elabora", "El área usuaria, que formuló el requerimiento", "El titular de la entidad"], "ok": 0, "exp": "La DEC es responsable de que el expediente esté completo y disponible, pero lo aprueba la AGA antes de la fase de selección.", "art": "Reglamento art. 54.1 y 54.2", "cap": 2, "caso": false}, {"id": "m2q2", "stem": "¿Quién emite la conformidad de la ejecución de un contrato de bienes?", "opts": ["El área usuaria", "La DEC", "La autoridad de la gestión administrativa", "El almacén central de la entidad"], "ok": 0, "exp": "El área usuaria verifica el cumplimiento y emite la conformidad. La sola recepción de los bienes no la constituye.", "art": "Reglamento arts. 20 (c) y 144.1", "cap": 2, "caso": false}, {"id": "m2q3", "stem": "¿Quién elabora la estrategia de contratación?", "opts": ["La DEC", "El área usuaria", "La autoridad de la gestión administrativa", "El titular de la entidad"], "ok": 0, "exp": "La DEC elabora la estrategia con base en el requerimiento y la información del área usuaria.", "art": "Reglamento arts. 14.2 (f) y 46.1", "cap": 2, "caso": false}, {"id": "m2q4", "stem": "¿Quién aprueba la contratación directa por una situación de emergencia?", "opts": ["El titular de la entidad", "La AGA, con facultad indelegable", "La DEC", "El OECE"], "ok": 0, "exp": "El titular aprueba las contrataciones directas de los literales b), c) y k) del art. 55.1: emergencia, desabastecimiento y continuación de contrato resuelto o nulo.", "art": "Reglamento art. 18 (c)", "cap": 2, "caso": false}, {"id": "m2q5", "stem": "¿Quién aprueba la contratación directa por proveedor único?", "opts": ["La AGA, y esa facultad es indelegable", "El titular de la entidad, en todos los supuestos de contratación directa", "El área usuaria que formuló el requerimiento de la contratación", "El comité de evaluadores, previo informe del oficial de compra"], "ok": 0, "exp": "La AGA aprueba los demás supuestos del art. 55.1, y cuando lo hace la facultad es indelegable.", "art": "Ley art. 55.2; Reglamento art. 19 (d)", "cap": 2, "caso": false}, {"id": "m2q6", "stem": "La DEC revisa un requerimiento. ¿Qué aspecto NO le corresponde decidir?", "opts": ["Los aspectos técnicos de la necesidad, que son del área usuaria", "Que la necesidad esté en el CMN", "Si existen existencias en el almacén", "Si la necesidad está en una ficha técnica o en el catálogo"], "ok": 0, "exp": "La DEC revisa el cumplimiento de la normativa de contratación, pero no los aspectos técnicos de la necesidad.", "art": "Reglamento art. 14.2 (b) a (e)", "cap": 2, "caso": false}, {"id": "m2q7", "stem": "¿Quiénes son los compradores públicos?", "opts": ["Los funcionarios y servidores de la DEC que intervienen en el proceso, certificados por el OECE", "Los miembros de cualquier comité de la entidad, aunque no pertenezcan a la DEC", "Los proveedores inscritos en el RNP que prestan apoyo a la entidad contratante", "Los servidores del área usuaria que formulan el requerimiento de la contratación"], "ok": 0, "exp": "Los compradores públicos son parte de la DEC y deben estar certificados conforme a la directiva del OECE.", "art": "Reglamento art. 15.1 (modificado por DS 001-2026-EF)", "cap": 2, "caso": false}, {"id": "m2q8", "stem": "¿Quién designa a un área técnica estratégica y por cuánto tiempo?", "opts": ["La AGA, por un año como mínimo", "El titular, de forma indefinida", "La DEC, por cada proceso", "El OECE, por un año"], "ok": 0, "exp": "La AGA puede designar unidades orgánicas por especialidad, por un año como mínimo, mediante documento de comunicación interna.", "art": "Reglamento art. 21.1", "cap": 2, "caso": false}]}, "3": {"name": "Planificación", "qs": [{"id": "c3a", "stem": "Un servicio tiene alta cuantía (supera el 10 % del monto total de servicios del PAC) y bajo riesgo. ¿Qué categoría de segmentación le corresponde?", "opts": ["Operacional", "Rutinario", "Crítico", "Estratégico"], "ok": 0, "exp": "Rutinarios: baja cuantía y bajo riesgo. Operacionales: alta cuantía y bajo riesgo. Críticos: baja cuantía y alto riesgo. Estratégicos: alta cuantía y alto riesgo.", "art": "Reglamento art. 125.1 y 125.2", "cap": 3, "caso": true}, {"id": "c3b", "stem": "Un servicio de baja cuantía fue declarado desierto en un procedimiento de los últimos dos años. ¿Cómo se segmenta?", "opts": ["Crítico: baja cuantía y alto riesgo, por el desierto previo en los últimos dos años", "Rutinario: al ser de baja cuantía, el desierto previo no cambia la categoría", "Operacional: el desierto previo lo vuelve de alta cuantía, aunque sea de bajo riesgo", "Estratégico: todo objeto que haya sido declarado desierto es estratégico"], "ok": 0, "exp": "También es de alto riesgo si el promedio de postores fue ≤ 3 en bienes o ≤ 2 en servicios, o si la disponibilidad en el mercado es limitada.", "art": "Reglamento art. 125.3", "cap": 3, "caso": true}, {"id": "c3c", "stem": "La entidad segmentó una contratación como estratégica. ¿Hacia qué se orienta principalmente su estrategia de contratación?", "opts": ["A disminuir los riesgos en el proceso de contratación", "A la atención oportuna y la reducción de costos", "A reducir el plazo de la convocatoria", "A evitar la interacción con el mercado"], "ok": 0, "exp": "En rutinarios y operacionales la estrategia se orienta a la atención oportuna y a reducir costos.", "art": "Reglamento art. 125.4", "cap": 3, "caso": true}, {"id": "m3q1", "stem": "Para aprobar un expediente de contratación, ¿qué exige el Reglamento respecto de la necesidad?", "opts": ["Que esté prevista en el CMN aprobado del año o en su modificatoria", "Que conste en el PAC del año anterior, aunque no figure en el CMN vigente", "Que el monto de la contratación sea mayor a 8 UIT vigentes al momento de la convocatoria", "Que la necesidad haya sido aprobada previamente por el OECE mediante opinión"], "ok": 0, "exp": "La necesidad debe encontrarse prevista en el CMN aprobado del año fiscal correspondiente o en su modificatoria.", "art": "Reglamento art. 54.3", "cap": 3, "caso": false}, {"id": "m3q2", "stem": "¿Quién realiza la segmentación de contrataciones?", "opts": ["La DEC", "El área usuaria", "La autoridad de la gestión administrativa", "El OECE"], "ok": 0, "exp": "La DEC clasifica las contrataciones del PAC y comunica la clasificación a las áreas usuarias.", "art": "Reglamento art. 42 (texto del DS 001-2026-EF)", "cap": 3, "caso": false}, {"id": "m3q3", "stem": "¿Qué contrataciones se excluyen de la segmentación?", "opts": ["Los contratos menores", "Las obras", "Las contrataciones directas", "Las contrataciones no programadas"], "ok": 0, "exp": "La segmentación clasifica las contrataciones del PAC, con excepción de las que correspondan a contratos menores.", "art": "Reglamento art. 42.1", "cap": 3, "caso": false}, {"id": "m3q4", "stem": "¿Qué es el anuncio de contratación futura?", "opts": ["Una publicación opcional en la Pladicop, en los procedimientos que la contemplan", "Un anuncio obligatorio en toda licitación pública, sin excepción alguna", "Un requisito que solo se exige en los contratos menores de la entidad", "Una función que cumple el OECE por cuenta de todas las entidades contratantes"], "ok": 0, "exp": "La entidad puede publicarlo, a través de la DEC, antes de la convocatoria, en los procedimientos que lo contemplen.", "art": "Reglamento art. 43", "cap": 3, "caso": false}, {"id": "m3q5", "stem": "La fase de actuaciones preparatorias comprende desde...", "opts": ["la segmentación del PAC del CMN hasta antes de la convocatoria", "la convocatoria del procedimiento de selección hasta el otorgamiento de la buena pro", "la buena pro hasta la liquidación final del contrato de la entidad contratante", "la aprobación del CMN hasta el pago final de la última prestación del contrato"], "ok": 0, "exp": "Incluye el anuncio de contratación futura, la estrategia, la aprobación del expediente y la elaboración de las bases.", "art": "Reglamento art. 41", "cap": 3, "caso": false}, {"id": "m3q6", "stem": "Una contratación no estaba programada, pero la necesidad sí figura en el CMN. ¿Cuándo la segmenta la DEC?", "opts": ["Luego de recibir el requerimiento", "Antes de aprobar el PAC", "Al convocar el procedimiento", "Nunca: esas contrataciones no se segmentan"], "ok": 0, "exp": "Para contrataciones no programadas, siempre que la necesidad esté en el CMN, la DEC segmenta luego de recibir el requerimiento.", "art": "Reglamento art. 42.3 (DS 001-2026-EF)", "cap": 3, "caso": false}, {"id": "m3q7", "stem": "¿Qué orden siguen estas actuaciones preparatorias?", "opts": ["Segmentación, requerimiento, estrategia, expediente y bases", "Requerimiento, segmentación, bases, estrategia de contratación y expediente", "Estrategia de contratación, segmentación, requerimiento, bases y expediente", "Bases, requerimiento, segmentación, estrategia de contratación y expediente"], "ok": 0, "exp": "El proceso va de la segmentación a la convocatoria: requerimiento, estrategia con base en él, aprobación del expediente y elaboración de las bases.", "art": "Reglamento arts. 41, 44 y 46", "cap": 3, "caso": false}]}, "4": {"name": "Actuaciones preparatorias", "qs": [{"id": "c4a", "stem": "El área usuaria de una red de salud exige que los postores de ambulancias tengan un taller de mantenimiento autorizado en la misma provincia de la entidad. ¿Qué debe hacer la DEC?", "opts": ["Observar el requerimiento: exigir ubicación afecta la libertad de concurrencia, salvo sustento", "Mantenerlo, porque el área usuaria es la que define libremente los requisitos del bien", "Aprobarlo si el área usuaria firma una declaración jurada de necesidad institucional", "Elevarlo al OECE para que valide si la restricción geográfica resulta legal o no"], "ok": 0, "exp": "La DEC verifica que el requerimiento cumpla las disposiciones y principios de la Ley y puede proponer mejoras.", "art": "Ley art. 5.1 (h); Reglamento art. 227.2", "cap": 4, "caso": true}, {"id": "c4b", "stem": "La DEC va a contratar bienes con un contrato menor. ¿Qué verifica antes, además del requerimiento?", "opts": ["Que no existan existencias en almacén ni bienes patrimoniales sin asignar que atiendan la necesidad", "Que el proveedor tenga más de cinco años de inscripción vigente en el RNP", "Que exista una ficha técnica aprobada por el OECE para cualquier bien a comprar", "Que se cuente con dos cotizaciones presentadas por el mismo proveedor invitado"], "ok": 0, "exp": "También verifica si el requerimiento está en una ficha de homologación o ficha técnica.", "art": "Reglamento art. 227.3 y 227.4", "cap": 4, "caso": true}, {"id": "c4c", "stem": "La entidad aprueba el expediente con una indagación de mercado y una reunión con proveedores; usó una sola fuente histórica y una sola herramienta. ¿Qué se hizo?", "opts": ["Una indagación básica (una fuente) y una consulta al mercado básica (una herramienta)", "Una indagación avanzada (dos fuentes) y una consulta al mercado básica (una herramienta)", "Solo una consulta al mercado avanzada, con dos herramientas de la misma clasificación", "Una indagación básica de dos herramientas y una consulta al mercado avanzada"], "ok": 0, "exp": "Los tipos de interacción con el mercado son la indagación (fuentes) y la consulta (herramientas).", "art": "Reglamento arts. 47 a 49", "cap": 4, "caso": true}, {"id": "c4d", "stem": "La DEC elaboró el expediente de contratación y el mismo jefe de la DEC lo aprueba antes de la selección. ¿Es correcto?", "opts": ["No: lo aprueba la AGA, previo a la fase de selección", "Sí: la DEC lo elabora y puede aprobarlo ella misma antes de convocar el procedimiento", "Sí: lo aprueba el jefe del área usuaria que formuló el requerimiento de la contratación", "No: lo aprueba siempre el titular de la entidad, sin posibilidad de delegar esa facultad"], "ok": 0, "exp": "La DEC es responsable de que el expediente esté completo y disponible.", "art": "Reglamento art. 54.1 y 54.2", "cap": 4, "caso": true}, {"id": "m4q1", "stem": "El requerimiento de un servicio se formula en...", "opts": ["términos de referencia", "especificaciones técnicas", "expediente técnico de obra", "bases estándar"], "ok": 0, "exp": "Bienes: especificaciones técnicas. Servicios: términos de referencia. Obras: expediente técnico u objetivos funcionales.", "art": "Ley art. 46.4", "cap": 4, "caso": false}, {"id": "m4q2", "stem": "¿Qué es una indagación avanzada?", "opts": ["La que usa dos o más fuentes de información", "La que usa una sola fuente", "La que usa dos o más herramientas", "La que incluye reuniones con proveedores"], "ok": 0, "exp": "La indagación se basa en fuentes: básica con una como mínimo, avanzada con dos o más. Las herramientas son de la consulta al mercado.", "art": "Reglamento art. 48.3", "cap": 4, "caso": false}, {"id": "m4q3", "stem": "¿Cómo se hace una consulta al mercado básica?", "opts": ["Con una sola herramienta de interacción, escrita o mediante reuniones", "Con una sola fuente de información histórica de la entidad contratante", "Con dos o más herramientas de interacción, de la misma o distinta clasificación", "Con dos o más fuentes de información provenientes de la Pladicop"], "ok": 0, "exp": "En la consulta básica se emplea una sola herramienta; en la avanzada, dos o más de la misma o distinta clasificación.", "art": "Reglamento art. 49.2", "cap": 4, "caso": false}, {"id": "m4q4", "stem": "¿Cuál de estos casos NO constituye fraccionamiento?", "opts": ["Contratar a través de un catálogo electrónico de acuerdo marco", "Comprar el combustible anual en pedidos pequeños para evitar licitar", "Dividir una obra en contratos menores para evitar la Ley", "Convocar dos procedimientos para evitar el que corresponde"], "ok": 0, "exp": "No es fraccionamiento la contratación por catálogos electrónicos ni repetir una compra idéntica cuando faltaron recursos o surgió una necesidad imprevisible.", "art": "Ley art. 50.2", "cap": 4, "caso": false}, {"id": "m4q5", "stem": "¿Quién es responsable de que el expediente de contratación esté completo y disponible?", "opts": ["La DEC", "La autoridad de la gestión administrativa", "El área usuaria", "El OECE"], "ok": 0, "exp": "La DEC es responsable de que toda la información se encuentre en el expediente y de su disponibilidad; la AGA lo aprueba.", "art": "Reglamento art. 54.1", "cap": 4, "caso": false}, {"id": "m4q6", "stem": "¿Cómo se conforma un comité de evaluadores?", "opts": ["Tres integrantes: al menos un comprador público de la DEC y un experto", "Un solo integrante, que es un comprador público de la DEC de la entidad", "Tres o cinco expertos en el objeto de la contratación, sin comprador público", "Cinco integrantes, todos servidores del área usuaria que pidió la contratación"], "ok": 0, "exp": "Oficial de compra: uno. Comité: tres. Jurado: tres o cinco expertos.", "art": "Reglamento art. 56.1", "cap": 4, "caso": false}, {"id": "m4q7", "stem": "Un procedimiento se declaró desierto. ¿Hay que aprobar otra vez el expediente para la siguiente convocatoria?", "opts": ["No, salvo que el informe de evaluación advierta que debe modificarse", "Sí, en todos los casos, porque se trata de una nueva convocatoria del procedimiento", "Sí, pero la nueva aprobación debe hacerla únicamente el titular de la entidad", "No, y tampoco hace falta evaluar las razones que llevaron a declarar el desierto"], "ok": 0, "exp": "La nueva convocatoria no requiere nueva aprobación, salvo que el informe de evaluación advierta que hay que modificar algún documento.", "art": "Reglamento art. 54.4", "cap": 4, "caso": false}, {"id": "m4q8", "stem": "Cuando se puede optar, ¿dónde se determina el tipo de evaluador?", "opts": ["En la estrategia de contratación", "En el CMN", "En las bases integradas", "En la resolución de buena pro"], "ok": 0, "exp": "La elección del tipo de evaluador se determina en la estrategia de contratación.", "art": "Reglamento art. 56.3", "cap": 4, "caso": false}]}, "18": {"name": "Compras centralizadas, encargos y sistemas de entrega", "qs": [{"id": "m18q1", "stem": "La DGA quiere que ciertos bienes se compren de manera centralizada para varias entidades. ¿Cómo lo establece?", "opts": ["Con resolución directoral que identifica bienes, entidades encargantes y encargadas", "Con un decreto supremo del MEF que identifica bienes, entidades encargantes y encargadas", "Con un convenio entre Perú Compras y el OECE para cada compra centralizada obligatoria", "Con una resolución del Tribunal que designa a la entidad encargada de la compra"], "ok": 0, "exp": "La compra centralizada puede iniciarse también a solicitud de las entidades encargantes o por ofrecimiento de la entidad encargada.", "art": "Reglamento art. 230.1 y 230.2", "cap": 18, "caso": true}, {"id": "m18q2", "stem": "Perú Compras ofrece una compra centralizada y las entidades interesadas aceptan. ¿Cómo se formaliza?", "opts": ["Con una comunicación de aceptación suscrita por los titulares de las encargantes", "Con una resolución de la AGA de cada entidad que desee sumarse a la compra", "Con un contrato notarial suscrito entre las entidades y Perú Compras", "Con un acta del comité de selección que conduce la compra centralizada"], "ok": 0, "exp": "La comunicación contiene los compromisos de transferencia de partidas y de recepción de prestaciones.", "art": "Reglamento art. 232.4", "cap": 18, "caso": true}, {"id": "m18q3", "stem": "Una entidad quiere encargar a Perú Compras sus actuaciones preparatorias. ¿Con qué documento y quién lo suscribe?", "opts": ["Convenio interinstitucional, suscrito por las AGA de las partes", "Convenio interinstitucional, suscrito por los titulares de ambas entidades", "Resolución directoral de la DGA que aprueba el encargo de las actuaciones", "Acta suscrita por las áreas usuarias de las dos entidades involucradas"], "ok": 0, "exp": "Se requieren informes de sustento técnico y legal del encargo y de los recursos presupuestarios.", "art": "Reglamento art. 237.1", "cap": 18, "caso": true}, {"id": "m18q4", "stem": "Una entidad quiere encargar a un organismo internacional las actuaciones preparatorias. ¿Qué debe acreditar?", "opts": ["Que el objeto es altamente especializado, que no puede determinar el requerimiento y que no se relaciona con sus funciones", "Solo que el monto de la contratación supera las 50 UIT vigentes", "Que el organismo internacional es el único proveedor en el mercado nacional", "Que la entidad no cuenta con una dependencia encargada de las contrataciones"], "ok": 0, "exp": "Para encargar la selección debe acreditar alto riesgo de frustración del procedimiento.", "art": "Reglamento art. 238.1 (a)", "cap": 18, "caso": true}, {"id": "m18q5", "stem": "¿Quién aprueba la compra corporativa obligatoria?", "opts": ["La DGA, mediante resolución directoral, pudiendo recibir propuestas de Perú Compras", "Perú Compras, mediante resolución directoral, pudiendo recibir propuestas de la DGA", "El Tribunal, mediante resolución, pudiendo recibir propuestas de las entidades", "El MEF, mediante decreto supremo, pudiendo recibir propuestas de Perú Compras"], "ok": 0, "exp": "Perú Compras emite por directiva los procedimientos y plazos.", "art": "Reglamento art. 241.1", "cap": 18, "caso": true}, {"id": "m18q6", "stem": "La entidad va a comprar equipamiento médico. ¿Qué sistema de entrega es obligatorio?", "opts": ["Llave en mano con mantenimiento, para garantizar su ciclo de vida y operatividad", "Llave en mano simple, porque basta con la instalación y puesta en funcionamiento", "Suministro con comodato, porque el proveedor entrega el equipo sin transferir su propiedad", "Diseño de la operación y mantenimiento, con un documento previo a la adquisición"], "ok": 0, "exp": "En equipamiento complejo puede incluirse la operación.", "art": "Reglamento art. 129 (b)", "cap": 18, "caso": false}, {"id": "m18q7", "stem": "El postor ofrece, además de los bienes, su instalación y puesta en funcionamiento. ¿Qué sistema de entrega es?", "opts": ["Llave en mano", "Suministro con comodato", "Gestión de instalaciones", "Diseño de la operación y mantenimiento"], "ok": 0, "exp": "Los sistemas se determinan durante la estrategia de contratación, de considerarlo pertinente.", "art": "Reglamento art. 129 (a)", "cap": 18, "caso": false}, {"id": "m18q8", "stem": "Para una indagación avanzada, ¿qué se necesita?", "opts": ["Dos o más fuentes de información", "Una sola fuente de información histórica de la propia entidad", "Dos o más herramientas de interacción con los proveedores", "Una reunión con proveedores y una difusión del requerimiento"], "ok": 0, "exp": "Las fuentes se prefieren de los tres últimos ejercicios presupuestales.", "art": "Reglamento art. 48.2 y 48.3", "cap": 18, "caso": false}]}, "5": {"name": "Impedimentos", "qs": [{"id": "c5a", "stem": "Un postor del segundo lugar, sancionado con inhabilitación vigente por el Tribunal, apela la buena pro. ¿Cómo se resuelve?", "opts": ["Se declara improcedente: el impugnante está impedido para contratar con el Estado", "Se admite y se resuelve el fondo, porque la sanción no afecta su derecho de impugnar", "Se declara fundado de oficio, por la irregularidad de que participara un sancionado", "Se suspende el trámite hasta que la sanción del impugnante sea levantada por el Tribunal"], "ok": 0, "exp": "La sanción vigente configura un impedimento del art. 30 de la Ley.", "art": "Reglamento art. 308 (e); Ley art. 30.1", "cap": 5, "caso": true}, {"id": "c5b", "stem": "Un servidor con influencia en el proceso dejó su cargo hace cuatro meses. ¿Puede contratar con su ex entidad?", "opts": ["No: sigue impedido hasta seis meses después de culminar su vínculo", "Sí: el impedimento terminó en el momento en que dejó de ejercer el cargo", "Sí: ya pasaron más de tres meses desde que culminó su vínculo con la entidad", "No: está impedido durante un año completo contado desde que dejó el cargo"], "ok": 0, "exp": "Los impedimentos personales duran en el cargo y hasta seis meses después.", "art": "Ley art. 30.1 (tipo 1)", "cap": 5, "caso": true}, {"id": "c5c", "stem": "Un primo hermano del gerente impedido postula en un procedimiento de la entidad. ¿Está impedido por parentesco?", "opts": ["No: los primos son parientes de cuarto grado y el impedimento llega hasta el segundo grado", "Sí: el primo hermano es pariente dentro del segundo grado de consanguinidad", "Sí: el parentesco por afinidad también alcanza al primo hermano del gerente", "No, pero solo si el primo domicilia en una provincia distinta a la de la entidad"], "ok": 0, "exp": "Alcanza hasta el segundo grado de consanguinidad y el segundo de afinidad, incluyendo cónyuge y conviviente.", "art": "Ley art. 30.1 (numeral 2)", "cap": 5, "caso": true}, {"id": "c5d", "stem": "Un impedido tuvo el 25 % del capital de una empresa durante los últimos doce meses antes de la convocatoria. ¿La empresa está impedida por ese motivo?", "opts": ["No por ese motivo: el impedimento exige más del 30 % del capital", "Sí: basta cualquier participación en el capital para que la empresa quede impedida", "Sí: el límite del impedimento es 20 % del capital dentro de los últimos doce meses", "No: el límite del impedimento es 50 % del capital de la empresa postora"], "ok": 0, "exp": "El impedimento se hereda en alcance y duración.", "art": "Ley art. 30.1 (tipo 3.A)", "cap": 5, "caso": true}, {"id": "m5q1", "stem": "¿Cuántos tipos de impedimentos para contratar establece el art. 30 de la Ley?", "opts": ["Cuatro", "Tres", "Cinco", "Siete"], "ok": 0, "exp": "Son cuatro: personales, por parentesco, para personas jurídicas o por representación, y derivados de sanciones y condenas.", "art": "Ley art. 30.1", "cap": 5, "caso": false}, {"id": "m5q2", "stem": "Un servidor deja su cargo. En general, ¿hasta cuándo está impedido de contratar con su entidad si tuvo influencia o información privilegiada?", "opts": ["Seis meses después de culminar su vínculo", "Doce meses después, en todos los casos", "Tres meses después", "No hay impedimento posterior"], "ok": 0, "exp": "Los impedimentos personales duran mientras se ejerce el cargo y hasta seis meses después de su culminación.", "art": "Ley art. 30.1 (tipo 1.F)", "cap": 5, "caso": false}, {"id": "m5q3", "stem": "En el impedimento por parentesco, ¿hasta qué grado alcanza?", "opts": ["Segundo grado de consanguinidad y segundo de afinidad", "Primer grado de consanguinidad y segundo de afinidad", "Cuarto grado de consanguinidad y segundo de afinidad", "Tercer grado de consanguinidad y primero de afinidad"], "ok": 0, "exp": "También incluye al cónyuge, al conviviente y al progenitor del hijo del impedido.", "art": "Ley art. 30.1 (numeral 2)", "cap": 5, "caso": false}, {"id": "m5q4", "stem": "El gerente de la entidad es un impedido del tipo 1.D. Su hermano postula en un proceso de la entidad. ¿Qué ocurre?", "opts": ["Son parientes de segundo grado de consanguinidad: el hermano queda impedido", "Son parientes de tercer grado: no hay impedimento para el hermano del gerente", "Son parientes de primer grado: quedan fuera del alcance del impedimento por parentesco", "El hermano no es pariente para este efecto, por no haber cónyuge ni convivencia"], "ok": 0, "exp": "Padres e hijos son de primer grado; abuelos, nietos y hermanos, de segundo grado de consanguinidad, que está dentro del impedimento.", "art": "Ley art. 30.1 (numeral 2)", "cap": 5, "caso": false}, {"id": "m5q5", "stem": "Una empresa con fines de lucro: un impedido tuvo el 35 % del capital hace ocho meses. ¿Qué ocurre?", "opts": ["Queda impedida: superó el 30 % dentro de los 12 meses anteriores a la convocatoria", "No queda impedida: el impedimento exige un porcentaje de capital mayor al 50 %", "No queda impedida: ya pasaron más de seis meses desde que el impedido tuvo ese capital", "Solo queda impedida si el impedido sigue ejerciendo su cargo en la entidad"], "ok": 0, "exp": "Aplica a empresas donde el impedido tenga o haya tenido más del 30 % del capital dentro de los doce meses anteriores a la convocatoria.", "art": "Ley art. 30.1 (tipo 3.A)", "cap": 5, "caso": false}, {"id": "m5q6", "stem": "Un impedido crea una empresa nueva del mismo rubro para postular. ¿Qué dice la Ley?", "opts": ["Queda impedida también, mientras dure el impedimento de quien lo origina", "La empresa nueva puede contratar con total normalidad, al ser una persona distinta", "La empresa nueva solo queda impedida si cuenta con más de un socio fundador", "La empresa nueva queda impedida únicamente durante seis meses desde su constitución"], "ok": 0, "exp": "Quienes, estando impedidos, constituyen, absorben o se fusionan con otra empresa del mismo rubro quedan impedidos mientras dure el impedimento original.", "art": "Ley art. 30.1 (tipo 3.F)", "cap": 5, "caso": false}, {"id": "m5q7", "stem": "Un proveedor es inhabilitado por el Tribunal durante 12 meses. ¿Durante cuánto tiempo no puede contratar con el Estado?", "opts": ["Todo el tiempo de la inhabilitación, en todo proceso a nivel nacional", "Solo con la entidad que lo denunció ante el Tribunal de Contrataciones", "Seis meses más después de vencida la inhabilitación impuesta por el Tribunal", "Hasta que pague la multa que corresponde a la misma infracción cometida"], "ok": 0, "exp": "Los proveedores sancionados con inhabilitación temporal o definitiva tienen impedimento durante el tiempo de la sanción en todo proceso de contratación pública.", "art": "Ley art. 30.1 (tipo 4.A)", "cap": 5, "caso": false}, {"id": "m5q8", "stem": "Aplicar el impedimento generaría riesgo de desabastecimiento. ¿Qué puede hacer la entidad?", "opts": ["Inaplicarlo de forma temporal, con sustento previo, en los casos que prevé el Reglamento", "Ignorarlo sin necesidad de sustento, porque el desabastecimiento prima sobre la Ley", "Pedir al OECE que lo declare inexistente para el caso concreto de la contratación", "Contratar al proveedor impedido sin acreditar la situación de desabastecimiento"], "ok": 0, "exp": "El Reglamento desarrolla los supuestos de inaplicación temporal, que la entidad sustenta antes de aprobar el procedimiento no competitivo.", "art": "Ley art. 30.2; Reglamento art. 40.3", "cap": 5, "caso": false}]}, "12": {"name": "Etapas, buena pro y desierto", "qs": [{"id": "c12a", "stem": "Dos ofertas empatan en puntaje total y también en puntaje técnico. Una es una MYPE integrada por personas con discapacidad; la otra, una MYPE común. ¿A quién se otorga la buena pro?", "opts": ["A la MYPE integrada por personas con discapacidad", "A la MYPE común, por ser la primera en haber presentado su oferta electrónica", "Por sorteo entre las dos ofertas, al haberse agotado el desempate técnico", "Al postor que ofreció el menor monto en su oferta económica final"], "ok": 0, "exp": "Orden: mejor puntaje técnico, MYPE con personas con discapacidad, MYPE y, por último, sorteo.", "art": "Reglamento art. 81", "cap": 12, "caso": true}, {"id": "c12b", "stem": "Un integrante de un consorcio presenta además una oferta individual en el mismo procedimiento. ¿Qué dice la norma?", "opts": ["Está prohibido: sus integrantes no pueden ofertar solos ni estar en más de un consorcio", "Es válido si los demás integrantes del consorcio lo autorizan por escrito", "Es válido, pero solo en los procedimientos de modalidad abreviada", "Es válido siempre que el consorcio no obtenga la buena pro del procedimiento"], "ok": 0, "exp": "La promesa de consorcio debe indicar integrantes, representante común, domicilio y obligaciones.", "art": "Reglamento art. 69.1 (d) (DS 001-2026-EF)", "cap": 12, "caso": true}, {"id": "c12c", "stem": "En la verificación posterior a la buena pro, la DEC halla un documento falso en la oferta ganadora. ¿Qué corresponde?", "opts": ["La AGA puede declarar la nulidad de la buena pro o del contrato y se comunica al Tribunal", "Solo se descalifica al postor ganador, sin comunicar el hecho al Tribunal de Contrataciones", "La propia DEC declara la nulidad de la buena pro por sí misma, sin intervención de la AGA", "Se espera a que el postor ejecute el contrato para recién sancionar la falsedad"], "ok": 0, "exp": "La DEC inicia la verificación dentro de diez días hábiles del consentimiento.", "art": "Reglamento art. 83.1 a 83.3", "cap": 12, "caso": true}, {"id": "c12d", "stem": "Se canceló un procedimiento porque desapareció la necesidad. A las dos semanas se quiere reconvocar el mismo objeto. ¿Es posible?", "opts": ["No: se impide convocar el mismo objeto durante el ejercicio presupuestal", "Sí: con una nueva aprobación del expediente de contratación por la AGA", "Sí: con la autorización expresa del titular y el informe de la DEC", "Sí: pasados quince días hábiles desde la resolución de cancelación"], "ok": 0, "exp": "La cancelación la dispone la AGA por resolución, antes de la buena pro.", "art": "Reglamento art. 85.1 (DS 001-2026-EF)", "cap": 12, "caso": true}, {"id": "c12e", "stem": "Se presentó una sola oferta en una licitación pública y ganó la buena pro. ¿Cuándo se consiente?", "opts": ["El mismo día de la notificación de su otorgamiento", "Al día siguiente de la notificación de su otorgamiento en la Pladicop", "A los cinco días hábiles de la notificación de su otorgamiento", "Cuando se firma el contrato con el postor que ganó la buena pro"], "ok": 0, "exp": "Con dos o más ofertas, se produce al día siguiente de vencido el plazo de apelación sin que nadie apele.", "art": "Reglamento art. 82.1 y 82.2", "cap": 12, "caso": true}, {"id": "m12q1", "stem": "En la fase de selección, hasta el perfeccionamiento del contrato, los plazos se cuentan en...", "opts": ["días hábiles", "días calendario", "días útiles según la entidad", "días calendario si el monto es bajo"], "ok": 0, "exp": "En la ejecución contractual los plazos pasan a ser calendario (art. 105.3), pero hasta perfeccionar el contrato son hábiles.", "art": "Reglamento art. 62.2", "cap": 12, "caso": false}, {"id": "m12q2", "stem": "¿Qué se necesita para convocar un procedimiento de selección?", "opts": ["El expediente aprobado y las bases elaboradas", "Solo el requerimiento del área usuaria, sin necesidad de bases elaboradas", "La opinión previa del OECE sobre las bases del procedimiento de selección", "El anuncio de contratación futura publicado con cuarenta días de anticipación"], "ok": 0, "exp": "La fase de selección inicia con la publicación del aviso de convocatoria en la Pladicop.", "art": "Reglamento art. 63.1 y 63.2", "cap": 12, "caso": false}, {"id": "m12q3", "stem": "¿Cuál es el plazo mínimo entre la convocatoria y la presentación de ofertas en los procedimientos competitivos que tienen consultas y observaciones?", "opts": ["22 días hábiles", "10 días hábiles", "15 días calendario", "8 días hábiles"], "ok": 0, "exp": "Se exceptúan las modalidades abreviadas y las que no contemplan consultas y observaciones.", "art": "Reglamento art. 64.1", "cap": 12, "caso": false}, {"id": "m12q4", "stem": "Si se publicó un anuncio de contratación futura con al menos 40 días calendario de anticipación, ¿hasta cuánto puede reducirse el plazo mínimo de convocatoria?", "opts": ["Según las bases estándar, pero nunca menos de 10 días calendario", "A 5 días hábiles, sin importar lo que señalen las bases estándar", "A 15 días hábiles, que es el mínimo permitido cuando hay anuncio previo", "No puede reducirse: el plazo de veintidós días hábiles es inamovible"], "ok": 0, "exp": "La reducción depende de lo que señalen las bases estándar, con un piso de diez días calendario.", "art": "Reglamento art. 64.3", "cap": 12, "caso": false}, {"id": "m12q5", "stem": "¿Qué requisito debe tener un proveedor para registrarse como participante?", "opts": ["Inscripción vigente en el RNP conforme al objeto de la contratación", "Haber ganado antes algún procedimiento de selección con la misma entidad contratante", "Pagar una tasa de participación a través de la Pladicop antes del registro", "Contar siempre con una carta de invitación de la entidad contratante"], "ok": 0, "exp": "El registro es gratuito y se hace por la Pladicop; solo en lista cerrada se exige invitación.", "art": "Reglamento art. 65.1", "cap": 12, "caso": false}, {"id": "m12q6", "stem": "En un empate, ¿qué criterio se aplica primero para otorgar la buena pro?", "opts": ["El postor con el mejor puntaje técnico", "El sorteo", "La microempresa o pequeña empresa", "El postor que presentó primero su oferta"], "ok": 0, "exp": "Orden: puntaje técnico; MYPE con personas con discapacidad; MYPE; sorteo.", "art": "Reglamento art. 81", "cap": 12, "caso": false}, {"id": "m12q7", "stem": "Se presentó una sola oferta. ¿Cuándo se produce el consentimiento de la buena pro?", "opts": ["El mismo día de la notificación de su otorgamiento", "A los 8 días hábiles", "Al día siguiente del vencimiento del plazo de apelación", "Cuando se firma el contrato"], "ok": 0, "exp": "Con dos o más ofertas, el consentimiento ocurre al día siguiente de vencido el plazo para apelar sin que se haya ejercido ese derecho.", "art": "Reglamento art. 82.1 y 82.2 (DS 001-2026-EF)", "cap": 12, "caso": false}, {"id": "m12q8", "stem": "¿En cuántos días hábiles tras el consentimiento de la buena pro la DEC inicia la verificación posterior?", "opts": ["Diez días hábiles", "Cinco días hábiles", "Quince días calendario", "Tres días hábiles"], "ok": 0, "exp": "Si se comprueba falsedad, la AGA puede declarar la nulidad de la buena pro o del contrato y se comunica al Tribunal.", "art": "Reglamento art. 83.1 a 83.3", "cap": 12, "caso": false}, {"id": "m12q9", "stem": "¿En cuál de estos casos un procedimiento queda desierto?", "opts": ["Cuando no se perfecciona el contrato por el art. 91", "Cuando solo se presenta una oferta y esa oferta resulta válida", "Cuando el postor ganador de la buena pro es una MYPE inscrita en el REMYPE", "Cuando alguno de los postores apela el otorgamiento de la buena pro"], "ok": 0, "exp": "También queda desierto sin ofertas o si ninguna oferta es válida.", "art": "Reglamento art. 84.1", "cap": 12, "caso": false}, {"id": "m12q10", "stem": "La cancelación del procedimiento por desaparición de la necesidad impide...", "opts": ["convocar el mismo objeto contractual durante el ejercicio presupuestal", "convocar cualquier otro objeto contractual durante los siguientes dos años", "que el Tribunal de Contrataciones revise la resolución de cancelación", "pagar a los postores que ya habían presentado sus ofertas en el procedimiento"], "ok": 0, "exp": "La AGA cancela por resolución, en cualquier momento previo a la buena pro, con informe de sustento de la DEC.", "art": "Reglamento art. 85.1 (DS 001-2026-EF)", "cap": 12, "caso": false}, {"id": "m12q11", "stem": "En una subasta inversa electrónica, si el segundo lugar no perfecciona el contrato, ¿hasta qué lugar de prelación se puede llamar?", "opts": ["Hasta el tercer lugar", "Solo al segundo lugar", "Hasta el quinto lugar", "No se llama a nadie: se declara desierto"], "ok": 0, "exp": "En los demás procedimientos se puede llamar sucesivamente a los siguientes postores.", "art": "Reglamento art. 91.5", "cap": 12, "caso": false}, {"id": "m12q12", "stem": "En el cuestionamiento al pliego de absolución de consultas y bases integradas, ¿en qué plazo presentan los participantes su solicitud?", "opts": ["Tres días hábiles desde la publicación del pliego y de las bases integradas", "Cinco días hábiles desde la publicación del pliego y de las bases integradas", "Ocho días hábiles desde la publicación del pliego y de las bases integradas", "Diez días calendario desde la publicación del pliego y de las bases integradas"], "ok": 0, "exp": "La entidad eleva los cuestionamientos al OECE a través de la Pladicop.", "art": "Reglamento art. 67.1 y 67.2 (DS 001-2026-EF)", "cap": 12, "caso": false}]}, "6": {"name": "Tipos de procedimiento y contratación directa", "qs": [{"id": "c6a", "stem": "Un proveedor quiere apelar una contratación directa por emergencia. ¿Procede?", "opts": ["No: los procedimientos no competitivos no son impugnables", "Sí: ante el Tribunal de Contrataciones, sin importar el monto de la contratación", "Sí: ante la AGA de la entidad, si la cuantía es menor o igual a 50 UIT", "Sí: solo si el proveedor alega vicios de nulidad en la aprobación de la directa"], "ok": 0, "exp": "Tampoco se impugnan las actuaciones preparatorias, las bases y los contratos menores.", "art": "Ley art. 72.3; Reglamento art. 303 (g)", "cap": 6, "caso": true}, {"id": "c6b", "stem": "A la base le falta el combustible para cumplir una misión inmediata y propone contratar directo porque \"la urgencia lo justifica\". ¿Qué debe evaluar?", "opts": ["Si se configura alguno de los trece supuestos de contratación directa, como emergencia o desabastecimiento", "Nada más: la urgencia por sí sola ya constituye causal de contratación directa", "Solo el monto de la contratación, que debe ser bajo para poder contratar directo", "Solo la opinión favorable del área usuaria sobre la urgencia de la necesidad"], "ok": 0, "exp": "La urgencia ", "Con una licitación pública obligatoria, para cualquier saldo de prestaciones pendientes", "Con un contrato menor, sin considerar el monto de las prestaciones pendientes", "Por contratación directa (literal k), aprobada por el área usuaria de la entidad"], "ok": 0, "exp": "Continuar un contrato resuelto o declarado nulo es un supuesto de contratación directa que aprueba el titular.", "art": "Ley art. 55.1 (k); Reglamento art. 18 (c)", "cap": 6, "caso": false}]}, "13": {"name": "Apelación a fondo", "qs": [{"id": "c13a", "stem": "En un procedimiento de S/ 100 000 un postor MYPE del segundo lugar apela y el recurso es declarado improcedente. ¿Cuál es la garantía y qué se ejecuta?", "opts": ["Garantía de S/ 500 (0.5 %) y se ejecuta el 50 %", "Garantía de S/ 3 000 y se ejecuta el 100 %", "Garantía de S/ 500 y se ejecuta el 100 %", "Garantía de S/ 5 000 y se ejecuta el 50 %"], "ok": 0, "exp": "La MYPE paga 0.5 % con tope de 25 UIT; el improcedente ejecuta el 50 % de la garantía.", "art": "Reglamento arts. 309.2 y 315.2", "cap": 13, "caso": true}, {"id": "c13b", "stem": "La buena pro de una licitación pública abreviada se notificó por la Pladicop. ¿En cuántos días hábiles puede apelarse?", "opts": ["Cinco días hábiles", "Ocho días hábiles", "Tres días hábiles", "Diez días hábiles"], "ok": 0, "exp": "En licitación y concurso públicos el plazo es de ocho días hábiles.", "art": "Reglamento art. 304.1 y 304.2", "cap": 13, "caso": true}, {"id": "c13c", "stem": "Un recurso de apelación es declarado fundado en parte. ¿Qué ocurre con la garantía?", "opts": ["Se devuelve completa, en cinco días hábiles de solicitada", "Se ejecuta el 50 % de la garantía, por haber sido solo parcialmente fundada", "Se ejecuta íntegra, porque el impugnante no obtuvo todo lo que pedía", "Se devuelve solo el 50 %, y el otro 50 % se ejecuta a favor de la entidad"], "ok": 0, "exp": "También se devuelve si hay nulidad, un impedimento sobrevenido o denegatoria ficta.", "art": "Reglamento art. 315.3 y 315.4", "cap": 13, "caso": true}, {"id": "c13d", "stem": "La apelación se interpuso ante la entidad y hay un postor ganador interesado. ¿En cuántos días hábiles puede absolver el traslado?", "opts": ["Tres días hábiles", "Cinco días hábiles", "Diez días hábiles", "Un día hábil"], "ok": 0, "exp": "Los postores emplazados absuelven el traslado en máximo tres días hábiles. Son plazos distintos: luego de eso la entidad tiene hasta diez días hábiles para resolver la apelación.", "art": "Reglamento art. 310.1 (d) y (g)", "cap": 13, "caso": true}, {"id": "c13e", "stem": "Al resolver una apelación, la AGA cuenta con opiniones legales y técnicas. ¿Quién no puede intervenir en la decisión?", "opts": ["Los servidores que participaron en el procedimiento de selección", "El jefe de la DEC, aunque no haya participado en el procedimiento de selección", "Los servidores del área legal que emiten la opinión previa sobre el recurso", "Los servidores del área de presupuesto que certificaron el crédito presupuestario"], "ok": 0, "exp": "La facultad de la AGA para resolver es indelegable.", "art": "Reglamento art. 310.2; Ley art. 74.1 (b)", "cap": 13, "caso": true}, {"id": "m13q1", "stem": "¿Cuál es el plazo para apelar contra la buena pro de una licitación pública?", "opts": ["Ocho días hábiles desde la notificación en la Pladicop", "Cinco días hábiles desde la notificación en la Pladicop", "Diez días calendario desde la notificación en la Pladicop", "Tres días hábiles desde la notificación en la Pladicop"], "ok": 0, "exp": "En concurso público abreviado, licitación abreviada, selección de expertos y comparación de precios el plazo es de cinco días hábiles.", "art": "Reglamento art. 304.1 y 304.2", "cap": 13, "caso": false}, {"id": "m13q2", "stem": "¿Cuál es el plazo para apelar en una comparación de precios?", "opts": ["Cinco días hábiles", "Ocho días hábiles", "Tres días hábiles", "Quince días calendario"], "ok": 0, "exp": "Lo mismo vale para las modalidades abreviadas y para la selección de expertos.", "art": "Reglamento art. 304.2", "cap": 13, "caso": false}, {"id": "m13q3", "stem": "Una subasta inversa electrónica tiene una cuantía que corresponde a una licitación pública. ¿En cuántos días hábiles se apela?", "opts": ["Ocho días hábiles", "Cinco días hábiles", "Tres días hábiles", "Diez días hábiles"], "ok": 0, "exp": "La regla general de la subasta inversa es cinco días hábiles, salvo que su cuantía corresponda a licitación o concurso público.", "art": "Reglamento art. 304.3", "cap": 13, "caso": false}, {"id": "m13q4", "stem": "¿Quién resuelve la apelación contra la cancelación de un procedimiento cuya cuantía es de 30 UIT?", "opts": ["El Tribunal de Contrataciones Públicas", "La autoridad de la gestión administrativa", "El titular de la entidad", "El área usuaria"], "ok": 0, "exp": "La nulidad de oficio y la cancelación se impugnan siempre ante el Tribunal, con independencia de la cuantía.", "art": "Reglamento art. 302.3", "cap": 13, "caso": false}, {"id": "m13q5", "stem": "En un procedimiento por relación de ítems, ¿qué cuantía determina ante quién se apela?", "opts": ["La cuantía total del procedimiento original", "La cuantía del ítem impugnado por el postor que presenta el recurso", "La cuantía del ítem de mayor monto dentro del procedimiento original", "La que fije libremente el postor al interponer el recurso de apelación"], "ok": 0, "exp": "Esto incluye los ítems derivados de aquellos declarados desiertos.", "art": "Reglamento art. 302.2", "cap": 13, "caso": false}, {"id": "m13q6", "stem": "¿Cuál de estos actos NO es impugnable mediante recurso de apelación?", "opts": ["Las bases y su integración", "La buena pro", "La declaratoria de desierto", "La cancelación del procedimiento"], "ok": 0, "exp": "Tampoco son impugnables las actuaciones preparatorias, los contratos menores y los procedimientos no competitivos.", "art": "Reglamento art. 303", "cap": 13, "caso": false}, {"id": "m13q7", "stem": "Un postor interpone apelación antes de que se otorgue la buena pro. ¿Qué ocurre?", "opts": ["La mesa de partes lo rechaza, verificando en la Pladicop la fecha programada de la buena pro", "Se admite y se suspende el procedimiento de selección hasta que se resuelva el recurso", "Se conserva y se resuelve recién cuando la entidad otorgue la buena pro", "Se acumula al recurso de otro postor que ya haya sido presentado antes"], "ok": 0, "exp": "El recurso solo puede interponerse después de la buena pro o del desierto.", "art": "Reglamento art. 307 (g); Ley art. 73.1", "cap": 13, "caso": false}, {"id": "m13q8", "stem": "La apelación omitió un requisito subsanable. ¿Cuánto tiempo tiene el apelante para subsanar?", "opts": ["Dos días hábiles, en un plazo único", "Cinco días hábiles, en un plazo único que suspende el procedimiento", "Tres días calendario, en un plazo prorrogable por una sola vez", "Diez días hábiles, en un plazo prorrogable por la autoridad competente"], "ok": 0, "exp": "Vencido el plazo, el recurso se considera como no presentado.", "art": "Reglamento art. 307 (c) y (d)", "cap": 13, "caso": false}, {"id": "m13q9", "stem": "El postor GANADOR de la buena pro presenta un recurso de apelación. ¿Qué sucede?", "opts": ["Se declara improcedente", "Se admite si paga la garantía", "Pasa directo al Tribunal", "Se acumula al recurso de otro postor"], "ok": 0, "exp": "Otras causales: fuera de plazo, acto no impugnable, impedimento, falta de competencia o de conexión lógica.", "art": "Reglamento art. 308 (h)", "cap": 13, "caso": false}, {"id": "m13q10", "stem": "¿De cuánto es la garantía de apelación de una microempresa?", "opts": ["0.5 % de la cuantía, con límite de 25 UIT", "3 % de la cuantía, con límite de 300 UIT", "1 % de la cuantía, con límite de 50 UIT", "5 % de la cuantía, sin límite"], "ok": 0, "exp": "La regla general es 3 % con tope de 300 UIT en el Reglamento (Ley 32187: hasta 3 %).", "art": "Reglamento art. 309.1 y 309.2", "cap": 13, "caso": false}, {"id": "m13q11", "stem": "La garantía de apelación se presenta ante la entidad. ¿Cuál es su plazo mínimo de vigencia?", "opts": ["Veinte días calendario desde el día siguiente de su emisión", "Sesenta días calendario desde el día siguiente de su emisión", "Diez días hábiles desde el día siguiente de su emisión", "Treinta días hábiles desde el día siguiente de su emisión"], "ok": 0, "exp": "Ante el Tribunal es de sesenta días calendario, y en ambos casos se renueva hasta que se agote la vía administrativa.", "art": "Reglamento art. 309.4", "cap": 13, "caso": false}, {"id": "m13q12", "stem": "¿En cuánto tiempo resuelve la entidad contratante la apelación?", "opts": ["Máximo diez días hábiles desde la presentación o subsanación del recurso", "Máximo cinco días hábiles desde la presentación o subsanación del recurso", "Máximo treinta días calendario desde la presentación o subsanación del recurso", "Máximo quince días hábiles desde la presentación o subsanación del recurso"], "ok": 0, "exp": "Los postores emplazados absuelven el traslado en tres días hábiles.", "art": "Reglamento art. 310.1 (d) y (g)", "cap": 13, "caso": false}, {"id": "m13q13", "stem": "¿En cuántos días hábiles resuelve el Tribunal desde que el expediente está listo para resolver?", "opts": ["Cinco días hábiles", "Diez días hábiles", "Tres días hábiles", "Quince días hábiles"], "ok": 0, "exp": "La audiencia pública se hace entre tres y cinco días hábiles de la notificación.", "art": "Reglamento art. 311.1 (b) y (h)", "cap": 13, "caso": false}, {"id": "m13q14", "stem": "La apelación es declarada infundada. ¿Qué pasa con la garantía?", "opts": ["Se ejecuta íntegra", "Se ejecuta el 50 %", "Se devuelve completa", "Se devuelve el 50 %"], "ok": 0, "exp": "Si es improcedente se ejecuta el 50 %. Se devuelve total si es fundada, hay nulidad, sobreviene un impedimento o hay denegatoria ficta.", "art": "Reglamento art. 315.1 a 315.3", "cap": 13, "caso": false}, {"id": "m13q15", "stem": "La apelación es declarada improcedente. ¿Cuánto de la garantía se ejecuta?",
