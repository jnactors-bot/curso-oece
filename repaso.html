e fiel cumplimiento en servicios"], "ok": 0, "exp": "La garantía de fiel cumplimiento puede ser fideicomiso, carta fianza financiera, seguro o retención de pago.", "art": "Reglamento art. 138.4", "cap": 7, "caso": true}, {"id": "c7b", "stem": "La entidad quiere entregar un adelanto directo sin pedir garantía al contratista porque es una empresa conocida. ¿Puede?", "opts": ["No: los adelantos solo se entregan si se garantizan por idéntico monto, sin excepción", "Sí, siempre que el contratista cuente con inscripción vigente en el RNP", "Sí, siempre que el adelanto sea menor al 10 % del monto del contrato original", "Sí, siempre que cuente con la autorización previa del titular de la entidad"], "ok": 0, "exp": "La garantía tiene vigencia mínima de tres meses, renovable hasta la amortización total.", "art": "Reglamento art. 113.3 (DS 001-2026-EF)", "cap": 7, "caso": true}, {"id": "c7c", "stem": "El postor ganador no tiene lista su garantía de fiel cumplimiento al vencer el plazo y pide un plazo adicional por estar en trámite. ¿Qué puede otorgar la DEC?", "opts": ["Hasta cuatro días hábiles adicionales, a pedido expreso del postor", "Hasta diez días hábiles adicionales, contados desde el consentimiento de la buena pro", "No puede otorgar plazo adicional alguno: la garantía debe estar lista al vencer el plazo", "Hasta tres días calendario adicionales, contados desde la presentación de la solicitud"], "ok": 0, "exp": "Después de subsanar las observaciones o presentar la garantía, el contrato se perfecciona en máximo tres días hábiles.", "art": "Reglamento art. 90.4 y 90.5", "cap": 7, "caso": true}, {"id": "c7d", "stem": "La entidad quiere dar un adelanto directo del 40 % en un contrato de servicios. ¿Es posible?", "opts": ["No: los adelantos directos no exceden el 30 % del contrato original", "Sí: hasta el 50 % del contrato original, siempre que se entregue la garantía", "Sí: hasta el 40 % del contrato original, si se presenta una carta fianza financiera", "No: los adelantos no existen en los contratos de servicios de ningún tipo"], "ok": 0, "exp": "En bienes y servicios solo proceden en los casos que prevé el reglamento y se amortizan descontando en cada pago.", "art": "Ley art. 66.3; Reglamento arts. 113.3 y 137.1", "cap": 7, "caso": true}, {"id": "m7q1", "stem": "Tras la buena pro, ¿cuántos días hábiles tiene el ganador para presentar los requisitos de perfeccionamiento cuando se requiere garantía?", "opts": ["Ocho", "Cinco", "Tres", "Diez"], "ok": 0, "exp": "El postor ganador presenta los requisitos dentro de ocho días hábiles desde el día siguiente al consentimiento de la buena pro.", "art": "Reglamento art. 90.1", "cap": 7, "caso": false}, {"id": "m7q2", "stem": "Si no se requiere garantía de fiel cumplimiento, ¿en cuántos días hábiles presenta el ganador los requisitos?", "opts": ["Cinco", "Ocho", "Tres", "Cuatro"], "ok": 0, "exp": "Cuando no se requiere garantía de fiel cumplimiento, el plazo es de cinco días hábiles.", "art": "Reglamento art. 90.2", "cap": 7, "caso": false}, {"id": "m7q3", "stem": "La DEC observa los requisitos del ganador. ¿Cuántos días hábiles tiene el postor para subsanar?", "opts": ["Cuatro", "Tres", "Cinco", "Ocho"], "ok": 0, "exp": "La DEC puede notificar observaciones en el plazo de tres días y otorga un máximo de cuatro días hábiles para subsanar.", "art": "Reglamento art. 90.3", "cap": 7, "caso": false}, {"id": "m7q4", "stem": "La entidad no perfecciona el contrato en los plazos. ¿Qué puede hacer el postor ganador?", "opts": ["Requerirla con un plazo de cinco días hábiles; vencido, queda liberado de firmar", "Ejecutar una garantía contra la entidad por el incumplimiento en el perfeccionamiento", "Pedir al Tribunal de Contrataciones que firme el contrato en reemplazo de la entidad", "Cobrar una penalidad a la entidad desde el primer día de retraso en la firma"], "ok": 0, "exp": "Vencido el plazo sin que la entidad perfeccione el contrato, el postor deja de estar obligado a su suscripción.", "art": "Reglamento art. 91.1 y 91.2", "cap": 7, "caso": false}, {"id": "m7q5", "stem": "El postor ganador no perfecciona el contrato por causa suya. ¿Qué ocurre?", "opts": ["Pierde automáticamente la buena pro y se llama al segundo en el orden de prelación", "Se declara desierto el procedimiento de inmediato, sin llamar a los otros postores", "La entidad firma el contrato igualmente, sin exigirle los requisitos que faltaron", "Debe pagar una penalidad equivalente al 10 % del monto de su oferta ganadora"], "ok": 0, "exp": "Si el segundo tampoco perfecciona, se puede llamar sucesivamente a los siguientes y, si nadie lo hace, se declara desierto.", "art": "Reglamento art. 91.3 y 91.4", "cap": 7, "caso": false}, {"id": "m7q6", "stem": "¿En qué plazo la DEC debe requerir al segundo postor?", "opts": ["Máximo dos días hábiles desde que queda consentida la pérdida de la buena pro", "Máximo cinco días calendario desde que se otorgó la buena pro al primer postor", "Máximo diez días hábiles desde que el primer postor presentó sus requisitos", "El mismo día en que el postor ganador comunica que no perfeccionará el contrato"], "ok": 0, "exp": "La DEC requiere al segundo del orden de prelación dentro de dos días hábiles, y este presenta los requisitos en el plazo del numeral 90.1.", "art": "Reglamento art. 91.3 (DS 001-2026-EF)", "cap": 7, "caso": false}, {"id": "m7q7", "stem": "La garantía de fiel cumplimiento equivale a...", "opts": ["El 10 % del monto del contrato original", "El 5 % del monto del contrato original", "El 15 % del monto del contrato original", "El 30 % del monto del contrato vigente"], "ok": 0, "exp": "Es requisito indispensable para perfeccionar el contrato y puede ser fideicomiso, carta fianza, seguro o retención de pago.", "art": "Reglamento art. 113.1", "cap": 7, "caso": false}, {"id": "m7q8", "stem": "En contratos de bienes y servicios, el fideicomiso como garantía de fiel cumplimiento procede solo si...", "opts": ["La ejecución dura más de noventa días calendario", "El monto supera 50 UIT", "El contratista es una MYPE", "La ejecución dura más de treinta días hábiles"], "ok": 0, "exp": "La garantía de fiel cumplimiento se mantiene vigente hasta la conformidad, y el fideicomiso solo procede si la ejecución supera noventa días calendario.", "art": "Reglamento art. 138.1 y 138.4", "cap": 7, "caso": false}, {"id": "m7q9", "stem": "¿Cuánto es el máximo de los adelantos directos?", "opts": ["El 30 % del monto del contrato original", "El 10 % del monto del contrato original", "El 20 % del monto del contrato vigente", "El 50 % del monto del contrato original"], "ok": 0, "exp": "Los documentos del procedimiento pueden establecer adelantos directos que en conjunto no excedan el 30 % del contrato original, con garantía por el mismo monto.", "art": "Ley art. 66.3; Reglamento art. 113.3", "cap": 7, "caso": false}]}, "8": {"name": "Ejecución contractual", "qs": [{"id": "c8a", "stem": "Contrato de bienes de S/ 200 000 con plazo de 50 días. El proveedor se atrasa. ¿Cuánto es la penalidad por mora por día?", "opts": ["S/ 1 000 por día", "S/ 500 por día", "S/ 2 000 por día", "S/ 400 por día"], "ok": 0, "exp": "En bienes y servicios F = 0.40.", "art": "Reglamento art. 120.1", "cap": 8, "caso": true}, {"id": "c8b", "stem": "En ese mismo contrato (S/ 200 000), ¿cuál es el tope de la suma de penalidades y en cuántos días de mora se alcanza?", "opts": ["S/ 20 000 (10 %), que se alcanzan en 20 días de mora", "S/ 10 000 (5 %), que se alcanzan en 10 días de mora", "S/ 20 000 (10 %), que se alcanzan en 40 días de mora", "S/ 30 000 (15 %), que se alcanzan en 30 días de mora"], "ok": 0, "exp": "La suma de penalidades por mora y otras no excede el 10 % del monto vigente del contrato o ítem.", "art": "Reglamento art. 119.2 y 120.1", "cap": 8, "caso": true}, {"id": "c8c", "stem": "La entidad va a resolver por incumplimiento un contrato cuyo plazo de ejecución vigente es de 60 días. ¿Qué plazo debe darle al contratista en el requerimiento previo?", "opts": ["Entre 6 y 9 días, que son el 10 % y el 15 % del plazo", "Exactamente 15 días, que es el plazo fijo para todos los contratos de bienes", "Entre 3 y 6 días, que es el plazo previsto para contratos menores a treinta días", "Entre 10 y 15 días, que son los porcentajes expresados como días calendario"], "ok": 0, "exp": "Si el plazo vigente es menor a treinta días se otorgan tres días; en obras de más de 60 días, quince.", "art": "Reglamento art. 122.1 (a) (DS 001-2026-EF)", "cap": 8, "caso": true}, {"id": "c8d", "stem": "La entidad demoró en emitir la conformidad más allá de su plazo. ¿Puede cobrarle penalidad al contratista por esos días?", "opts": ["No: los días que la entidad excede para emitir la conformidad no se imputan al contratista", "Sí: la penalidad sigue corriendo hasta que la entidad emita la conformidad", "Sí, pero solo se le puede cobrar la mitad de la penalidad diaria correspondiente", "No, pero solo si el contratista reclama por escrito dentro de los tres días"], "ok": 0, "exp": "La conformidad se emite en máximo siete días, o veinte en consultoría.", "art": "Reglamento art. 144.3 y 144.6", "cap": 8, "caso": true}, {"id": "c8e", "stem": "El contratista pide una ampliación de plazo doce días hábiles después de que terminó el hecho que causó el atraso. ¿Qué ocurre?", "opts": ["Es extemporánea y se tiene por no presentada: el plazo es de diez días hábiles", "Se admite, pero con una penalidad por haberla presentado fuera del plazo", "Se aprueba por silencio a los doce días, al no responder la entidad", "Se evalúa si el contratista logra justificar el motivo de la demora en pedirla"], "ok": 0, "exp": "La AGA resuelve en doce días hábiles; si no responde, se aprueba, salvo incumplimiento del procedimiento.", "art": "Reglamento art. 142.3 y 142.5", "cap": 8, "caso": true}, {"id": "m8q1", "stem": "En un contrato de bienes, ¿cuánto vale el factor F en la fórmula de la penalidad por mora?", "opts": ["0.40", "0.25", "0.15", "0.10"], "ok": 0, "exp": "Para bienes y servicios, F = 0.40. Los valores 0.25 y 0.15 son para obras de mayor plazo.", "art": "Reglamento art. 120.1", "cap": 8, "caso": false}, {"id": "m8q2", "stem": "¿Cuánto es lo máximo que pueden sumar la penalidad por mora y las otras penalidades de un contrato?", "opts": ["El 10 % del monto vigente del contrato o del ítem", "El 5 % del monto original del contrato o del ítem", "El 15 % del monto vigente del contrato o del ítem", "El 20 % del monto adjudicado en la buena pro"], "ok": 0, "exp": "La suma de penalidades por mora y otras penalidades no debe exceder el 10 % del monto vigente del contrato o, de ser el caso, del ítem.", "art": "Reglamento art. 119.2", "cap": 8, "caso": false}, {"id": "m8q3", "stem": "Un proveedor de repuestos lleva 20 días de atraso y la penalidad todavía no llega al tope. La base quiere resolver el contrato por incumplimiento. ¿Qué debe hacer primero?", "opts": ["Requerirle por escrito que cumpla en un plazo, bajo apercibimiento de resolver", "Resolver de inmediato el contrato, porque el atraso acumulado ya es considerable", "Esperar a que el proveedor presente una solicitud de ampliación de plazo", "Pedir autorización previa al Tribunal de Contrataciones para poder resolver"], "ok": 0, "exp": "Antes de resolver por incumplimiento hay que requerir a la otra parte que cumpla, bajo apercibimiento de resolver, dándole un plazo de 10 % a 15 % del plazo de ejecución.", "art": "Reglamento art. 122.1 (a)", "cap": 8, "caso": false}, {"id": "m8q4", "stem": "Un contrato de bienes dura 40 días y el proveedor incumple. ¿Entre cuántos días debe estar el plazo del requerimiento previo a la resolución?", "opts": ["De 4 a 6 días", "De 2 a 3 días", "De 8 a 12 días", "De 10 a 15 días"], "ok": 0, "exp": "El plazo no puede ser menor del 10 % ni mayor del 15 % del plazo de ejecución: de 40 días, entre 4 y 6 días.", "art": "Reglamento art. 122.1 (a), modificado por DS 001-2026-EF", "cap": 8, "caso": false}, {"id": "m8q5", "stem": "Un contrato de bienes dura 20 días y el proveedor incumple. ¿Qué plazo debe darle la entidad en el requerimiento previo?", "opts": ["Tres días", "Dos días", "Cinco días", "Diez días"], "ok": 0, "exp": "Cuando el plazo del contrato o del entregable es menor a treinta días, se otorgan tres días.", "art": "Reglamento art. 122.1 (a)", "cap": 8, "caso": false}, {"id": "m8q6", "stem": "¿En cuál de estos casos la entidad puede resolver por incumplimiento sin requerimiento previo?", "opts": ["Cuando ya se completó el monto máximo de penalidad", "Cuando el monto del contrato es relativamente bajo", "Cuando hay urgencia por el cierre del año fiscal", "Cuando el área usuaria lo solicita verbalmente"], "ok": 0, "exp": "El apercibimiento previo no se aplica si se llegó al monto máximo de penalidad, o si la entidad sustenta objetivamente que el incumplimiento ya no puede revertirse, según el pronunciamiento del área usuaria.", "art": "Reglamento art. 122.2", "cap": 8, "caso": false}, {"id": "m8q7", "stem": "¿Cuál de estas situaciones justifica el retraso y evita la penalidad por mora?", "opts": ["Una ampliación de plazo debidamente aprobada", "Que el proveedor tuvo mucha carga de trabajo", "Que la entidad no le recordó la fecha de entrega", "Que el monto del contrato es relativamente bajo"], "ok": 0, "exp": "El retraso se justifica con una solicitud de ampliación de plazo debidamente aprobada, o cuando el contratista acredita objetivamente que el mayor tiempo no le es imputable.", "art": "Reglamento art. 120.4", "cap": 8, "caso": false}, {"id": "m8q8", "stem": "¿Cuál de estas NO es una causa de resolución del contrato según la Ley?", "opts": ["Que el contratista pida una ampliación de plazo", "Caso fortuito o fuerza mayor", "Presentar documentación falsa durante la ejecución", "Incumplir la cláusula anticorrupción"], "ok": 0, "exp": "Las causas son: fuerza mayor, incumplimiento, hecho sobreviniente, cláusula anticorrupción, documentación falsa o inexacta, y terminación anticipada pactada. Pedir una ampliación de plazo no lo es.", "art": "Ley art. 68.1", "cap": 8, "caso": false}, {"id": "m8q9", "stem": "¿En qué plazo máximo se emite la conformidad de un entregable, salvo que se requieran pruebas?", "opts": ["Siete días desde el día siguiente de recibido", "Quince días desde el día siguiente de recibido el entregable", "Treinta días desde el día siguiente de recibido el entregable", "Diez días hábiles desde el día siguiente de recibido el entregable"], "ok": 0, "exp": "La conformidad se emite en máximo siete días, o veinte si es consultoría, bajo responsabilidad de quien debe emitirla.", "art": "Reglamento art. 144.3", "cap": 8, "caso": false}, {"id": "m8q10", "stem": "¿En qué plazo máximo se emite la conformidad de una consultoría?", "opts": ["Veinte días", "Siete días", "Quince días", "Treinta días"], "ok": 0, "exp": "Para consultorías, la conformidad se emite en un máximo de veinte días.", "art": "Reglamento art. 144.3", "cap": 8, "caso": false}, {"id": "m8q11", "stem": "Durante la ejecución del contrato, ¿en qué se cuentan los plazos?", "opts": ["En días calendario, salvo que el Reglamento indique hábiles", "En días hábiles, sin excepción, igual que durante la fase de selección", "En días útiles, según lo que decida cada entidad en sus documentos de gestión", "En días hábiles, pero solo cuando el contrato es de ejecución de obra"], "ok": 0, "exp": "Durante la ejecución contractual los plazos se contabilizan en días calendario, excepto cuando el Reglamento indique lo contrario.", "art": "Reglamento art. 105.3", "cap": 8, "caso": false}, {"id": "m8q12", "stem": "Si hay observaciones a lo entregado, ¿cuánto puede durar como máximo el plazo para subsanarlas?", "opts": ["El 30 % del plazo del entregable", "El 10 % del plazo del entregable", "El 50 % del plazo del contrato", "El mismo plazo del contrato"], "ok": 0, "exp": "El plazo de subsanación no debe ser mayor del 30 % del plazo del entregable. Si se subsana a tiempo, no corresponde penalidad.", "art": "Reglamento art. 144.4", "cap": 8, "caso": false}, {"id": "m8q13", "stem": "La entidad se demora en emitir la conformidad. ¿Qué pasa con la penalidad por mora?", "opts": ["Los días de retraso de la entidad no pueden imputarse al contratista", "La penalidad se aplica igual al contratista por el total de los días de atraso", "La penalidad por mora se duplica mientras dure la demora de la entidad", "Se suspende la vigencia de la garantía de fiel cumplimiento hasta la conformidad"], "ok": 0, "exp": "Si la entidad excede el plazo para emitir la conformidad, esos días no se cargan al contratista para efectos de penalidades.", "art": "Reglamento art. 144.6", "cap": 8, "caso": false}, {"id": "m8q14", "stem": "El contratista quiere pedir una ampliación de plazo. ¿En cuántos días hábiles debe solicitarla?", "opts": ["Diez días hábiles, desde el adicional aprobado o el fin del hecho causante del atraso", "Cinco días hábiles, desde el adicional aprobado o el fin del hecho causante del atraso", "Quince días hábiles, desde que la entidad notifica el inicio del plazo de ejecución", "Treinta días calendario, desde que el contratista advierte el atraso en la prestación"], "ok": 0, "exp": "Las solicitudes extemporáneas se tienen por no presentadas.", "art": "Reglamento art. 142.3", "cap": 8, "caso": false}, {"id": "m8q15", "stem": "La AGA no responde la solicitud de ampliación en doce días hábiles. ¿Qué ocurre?", "opts": ["Se tiene por aprobada, si el contratista cumplió el procedimiento", "Se tiene por denegada, y el contratista puede acudir a la JPRD de inmediato", "Se archiva sin efectos, y el contratista debe presentar una nueva solicitud", "Pasa al Tribunal de Contrataciones para que emita su decisión final"], "ok": 0, "exp": "Si no hay pronunciamiento, la solicitud se tiene por aprobada, salvo que no se haya cumplido estrictamente el procedimiento del 142.3.", "art": "Reglamento art. 142.5", "cap": 8, "caso": false}]}, "14": {"name": "Modificaciones del contrato", "qs": [{"id": "c14a", "stem": "Un contrato de servicios es de S/ 400 000. ¿Cuál es el máximo de adicionales que puede aprobar la AGA y qué debe publicar?", "opts": ["S/ 100 000 (25 %), con resolución publicada en la Pladicop y sin adenda", "S/ 200 000 (50 %), con adenda suscrita por ambas partes del contrato", "S/ 100 000 (25 %), pero con adenda firmada por ambas partes del contrato", "S/ 40 000 (10 %), con resolución publicada en la Pladicop y sin adenda"], "ok": 0, "exp": "Requiere sustento técnico y legal y certificación presupuestaria; no se aprueba en vía de regularización.", "art": "Reglamento art. 141.1 y 141.3", "cap": 14, "caso": true}, {"id": "c14b", "stem": "El contrato vigente es de S/ 500 000. ¿Cuánto se puede subcontratar como máximo?", "opts": ["S/ 200 000 (40 %)", "S/ 125 000 (25 %)", "S/ 150 000 (30 %)", "S/ 250 000 (50 %)"], "ok": 0, "exp": "El pedido incluye alcance y RNP del subcontratista; si la entidad no responde en 5 días hábiles se entiende denegado.", "art": "Reglamento art. 108.1 a 108.3", "cap": 14, "caso": true}, {"id": "c14c", "stem": "Un contratista debe entregar 10 mil casacas en 60 días; su fábrica se incendia y pide ceder su posición a otro contratista. ¿Qué responde la norma?", "opts": ["No procede: la cesión solo cabe en supuestos tasados; debió pedir ampliación de plazo o resolver", "Procede: la entidad la aprueba si el cesionario cumple con el mismo perfil del contratista", "Procede solo si el contratista paga previamente una penalidad por el incumplimiento", "Procede en caso fortuito o fuerza mayor, como el incendio que sufrió su fábrica"], "ok": 0, "exp": "La cesión de una entidad a otra tiene supuestos propios.", "art": "Reglamento art. 112.1", "cap": 14, "caso": true}, {"id": "c14d", "stem": "Dos meses después de terminar un contrato de bienes, la entidad quiere comprar al mismo contratista otro lote del mismo bien por el 20 % del monto original. ¿Procede?", "opts": ["Sí, como complementaria: una sola vez, en tres meses, hasta 30 % y con sustento del área u ece bienes de iguales o mejores características que su oferta. ¿Cómo se aprueba esa modificación?", "opts": ["Con una adenda, sustento del área usuaria y opinión favorable de la DEC", "Solo con una resolución de la AGA, sin necesidad de suscribir adenda alguna", "Con la aprobación previa del Tribunal de Contrataciones mediante resolución", "No se puede aprobar una modificación de ese tipo bajo ninguna circunstancia"], "ok": 0, "exp": "No debe desnaturalizar la prestación ni variar el objeto contractual.", "art": "Reglamento art. 143", "cap": 14, "caso": false}]}, "15": {"name": "Obras I · Expediente técnico, inicio, supervisión y adelantos", "qs": [{"id": "c15a", "stem": "Un residente de obra está designado en dos obras distintas, no convocadas por paquete. ¿Es válido?", "opts": ["No: el residente es permanente y exclusivo, y no puede atender más de una obra a la vez", "Sí, siempre que las dos obras se ubiquen en la misma provincia y estén cercanas", "Sí, siempre que el supervisor de las obras lo autorice por escrito en el cuaderno", "Sí, siempre que la entidad contratante acepte expresamente la doble designación"], "ok": 0, "exp": "Solo en obras convocadas por paquete las bases definen la participación del residente.", "art": "Reglamento art. 177.1 y 177.3", "cap": 15, "caso": true}, {"id": "c15b", "stem": "En una obra de solo construcción se pretende entregar un adelanto de materiales del 25 % del contrato original. ¿Procede?", "opts": ["No: el adelanto de materiales no excede el 20 % del contrato original", "Sí: puede llegar hasta el 30 % del monto del contrato original de la obra", "Sí: puede llegar hasta el 25 % si la entidad cuenta con previsión presupuestal", "No: en solo construcción no existe el adelanto para materiales e insumos"], "ok": 0, "exp": "El adelanto directo es 10 % y el adelanto por avance, 10 %.", "art": "Reglamento art. 178.3 (b)", "cap": 15, "caso": true}, {"id": "c15c", "stem": "Para una obra de S/ 4 000 000 el contratista pide fideicomiso p diente, comunicar al contratista quién supervisa, entregar el adelanto directo solicitado y firmar el contrato tripartito de la JPRD.", "art": "Reglamento art. 176.1", "cap": 15, "caso": false}, {"id": "m15q6", "stem": "La entidad no cumple las condiciones de inicio en 10 días de requerida. ¿Qué puede pedir el contratista?", "opts": ["Resarcimiento de daños hasta 0.05 % del contrato por día, con tope de 3 %, o la resolución", "Una penalidad de 10 % del monto del contrato, que descuenta de la garantía de la entidad", "Solo una ampliación del plazo de ejecución, sin ningún reconocimiento económico", "Nada: debe esperar hasta que la entidad cumpla con las condiciones de inicio"], "ok": 0, "exp": "El DS 001-2026-EF también modificó el plazo máximo para iniciar las gestiones a veintidós días.", "art": "Reglamento art. 176.3 y 176.4 (DS 001-2026-EF)", "cap": 15, "caso": false}, {"id": "m15q7", "stem": "¿Cuál es el máximo del adelanto directo en una obra de solo construcción?", "opts": ["El 10 % del monto del contrato original", "El 30 % del monto del contrato original", "El 20 % del monto del contrato original", "El 50 % del contrato vigente"], "ok": 0, "exp": "El adelanto para materiales no excede el 20 % y el adelanto por avance, el 10 %.", "art": "Reglamento art. 178.3 (b)", "cap": 15, "caso": false}, {"id": "m15q8", "stem": "¿Cuál es el máximo del adelanto de materiales e insumos en obras de solo construcción?", "opts": ["El 20 % del monto del contrato original", "El 10 % del monto del contrato original", "El 30 % del contrato vigente", "El 40 % del contrato original"], "ok": 0, "exp": "El adelanto directo es 10 % y el por avance, 10 %.", "art": "Reglamento art. 178.3 (b)", "cap": 15, "caso": false}, {"id": "m15q9", "stem": "¿Qué condiciones deben cumplirse para otorgar otro adelanto por avance durante la obra?", "opts": ["Avance físico real de 60 % y que sea igual o mayor al programado", "Avance físico real de 30 % y que sea mayor al avance programado", "Avance físico real de 80 % sin importar el porcentaje que se programó", "Que solo lo solicite el contratista, sin considerar el avance de la obra"], "ok": 0, "exp": "Se amortiza mediante descuentos proporcionales en las valorizaciones desde su entrega.", "art": "Reglamento art. 178.5 y 180.3", "cap": 15, "caso": false}, {"id": "m15q10", "stem": "En consultorías de obra, ¿qué adelantos proceden?", "opts": ["Solo adelantos directos, de hasta 30 % del contrato original", "Adelantos directos, de materiales y por avance, hasta 30 % del contrato original", "Solo adelantos por avance, de hasta 10 % del contrato original de la consultoría", "Ninguno: en consultorías de obra no proceden adelantos de ningún tipo"], "ok": 0, "exp": "No procede el fideicomiso para adelantos en consultorías de obra.", "art": "Reglamento art. 178.2 y 178.3 (a)", "cap": 15, "caso": false}, {"id": "m15q11", "stem": "El contratista pide el adelanto directo. ¿En cuánto tiempo debe entregarlo la entidad una vez recibida la garantía?", "opts": ["Siete días como máximo", "Veinte días hábiles", "Tres días", "Treinta días calendario"], "ok": 0, "exp": "El contratista tiene diez días desde el perfeccionamiento para solicitarlo, con cinco días adicionales para la garantía si lo sustenta.", "art": "Reglamento art. 179.1 y 179.2", "cap": 15, "caso": false}, {"id": "m15q12", "stem": "¿Desde qué monto de obra procede el fideicomiso para el adelanto directo?", "opts": ["Cuando el componente de obra supera los S/ 5 000 000", "Cuando el contrato de obra supera el monto de S/ 1 000 000", "Cuando el contrato de obra supera el monto de S/ 50 000 000", "Solo cuando se trata de contratos de consultoría de obras de cualquier monto"], "ok": 0, "exp": "La entidad tiene veinte días hábiles para constituirlo y no procede para el componente de diseño.", "art": "Reglamento art. 184.1 y 184.2", "cap": 15, "caso": false}, {"id": "m15q13", "stem": "¿Qué diferencia hay entre supervisor e inspector de obra?", "opts": ["El supervisor es contra
